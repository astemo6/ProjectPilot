<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>执行层计划 · Execution Plan</title>
<style>
:root{
  --steel:#1e3a52; --steel2:#2b4d6a; --steel3:#3a6283; --accent:#2563eb;
  --tx1:#1f2937; --tx2:#4b5563; --tx3:#6b7280;
  --bg:#eef1f5; --side:#f8fafc; --card:#fff; --line:#d9dee5; --line2:#e5e7eb;
  --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx1);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--steel);color:#fff;height:48px;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
header h1{font-size:15px;font-weight:600}
header .sub{font-size:11px;opacity:.7}
header .sp{flex:1}
header button{background:var(--steel2);border:1px solid #4b6a85;color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
header button:hover{background:var(--steel3)}
.langbtns{display:flex;gap:4px}
.langbtns button{padding:4px 8px;font-size:11px}
.langbtns button.on{background:var(--accent);border-color:var(--accent)}
.toolbar{background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.toolbar button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--tx1)}
.toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.toolbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar button.primary:hover{background:#1d4ed8}
.toolbar .sep{width:1px;height:20px;background:var(--line)}
.toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--tx1);background:#fff;cursor:pointer;max-width:220px}
.toolbar select:hover{border-color:var(--accent)}
.toolbar .ck{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--tx1);cursor:pointer;user-select:none;white-space:nowrap}
.toolbar .ck input{margin:0;accent-color:var(--accent);cursor:pointer}
.viewbtns{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.viewbtns button{border:none;border-radius:0;padding:6px 14px}
.viewbtns button.on{background:var(--steel2);color:#fff}
.main{flex:1;display:flex;min-height:0}
.table-pane{width:460px;min-width:200px;max-width:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
/* 表头与表体共用同一滚动容器：竖分割线上下始终对齐；scrollbar-gutter 避免滚动条出现/消失时列宽跳动 */
.table-scroll{flex:1;overflow:auto;min-height:0;scrollbar-gutter:stable}
.table-inner{min-width:0}
.table-head{display:flex;background:var(--steel);color:#fff;font-size:11px;font-weight:600;flex-shrink:0;position:sticky;top:0;z-index:2}
.table-head>div{padding:8px 6px;border-right:1px solid #4b6a85;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.trow{display:flex;border-bottom:1px solid var(--line2);cursor:pointer;align-items:stretch}
.trow:hover{background:#eef4ff}
.trow.sel{background:#dbeafe}
.trow>div{padding:7px 6px;border-right:1px solid var(--line2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;display:flex;align-items:center}
.trow.group{background:#e8eef5;font-weight:600}
.trow.group>div{font-size:12px}
.trow .c-id{width:36px;justify-content:center;color:var(--tx3);flex-shrink:0}
.trow .c-name{flex:1;min-width:0}
.trow .c-owner{width:64px;flex-shrink:0}
.trow .c-dur{width:52px;justify-content:center;flex-shrink:0}
.trow .c-prog{width:56px;justify-content:center;flex-shrink:0}
.trow .c-start{width:86px;justify-content:center;flex-shrink:0;color:var(--tx2)}
.trow .c-end{width:86px;justify-content:center;flex-shrink:0;color:var(--tx2)}
.trow .c-float{width:64px;justify-content:center;flex-shrink:0;color:var(--tx2)}
.trow .c-var{width:52px;justify-content:center;flex-shrink:0;color:var(--tx2)}
.trow .c-output,.trow .c-remarks{width:120px;flex-shrink:0;color:var(--tx2)}
.table-head .c-output,.table-head .c-remarks{width:120px;flex-shrink:0}
.table-head .c-id{width:36px;text-align:center;flex-shrink:0}
.table-head .c-name{flex:1}
.table-head .c-owner{width:64px;flex-shrink:0}
.table-head .c-dur{width:52px;text-align:center;flex-shrink:0}
.table-head .c-prog{width:56px;text-align:center;flex-shrink:0}
.table-head .c-start{width:86px;text-align:center;flex-shrink:0}
.table-head .c-end{width:86px;text-align:center;flex-shrink:0}
.table-head .c-float{width:64px;text-align:center;flex-shrink:0}
.table-head .c-var{width:52px;text-align:center;flex-shrink:0}
/* ===== 冻结列：ID + 任务名称（横向滚动时固定左侧，表头与表体均冻结） ===== */
.table-head>div{position:relative}
.table-head .c-id,.table-head .c-name{position:sticky;background:var(--steel);z-index:4}
.table-head .c-id{left:0}
.table-head .c-name{left:36px}
.trow .c-id,.trow .c-name{position:sticky;z-index:1;background:var(--card)}
.trow .c-id{left:0}
.trow .c-name{left:36px}
.trow:hover .c-id,.trow:hover .c-name{background:#eef4ff}
.trow.sel .c-id,.trow.sel .c-name{background:#dbeafe}
.trow.group .c-id,.trow.group .c-name{background:#e8eef5}
/* 列宽拖拽手柄：表头单元格 hover 时显示竖线，左右箭头光标 */
.col-resize{position:absolute;top:0;bottom:0;right:-3px;width:7px;cursor:col-resize;z-index:5;display:none}
.col-resize::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;border-radius:1px;background:var(--accent)}
.table-head>div:hover .col-resize{display:block}
body.resizing{cursor:col-resize;user-select:none}
body.resizing .col-resize{display:block}
/* 列设置弹出菜单 */
.col-menu{position:fixed;z-index:60;display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:8px 10px;min-width:150px}
.col-menu h4{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.col-menu label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx1);padding:4px 2px;cursor:pointer;user-select:none;white-space:nowrap}
.col-menu label.dis{opacity:.45;cursor:default}
.col-menu input{margin:0;accent-color:var(--accent)}
/* 模板库下拉菜单（复用 col-menu 容器样式；分组标题+条目按钮） */
.tpl-g{font-size:11px;font-weight:600;color:var(--tx3);padding:8px 2px 2px}
.tpl-it{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:none;padding:6px 8px;font-size:12px;cursor:pointer;color:var(--tx1);border-radius:4px;text-align:left}
.tpl-it:hover{background:#eef4ff;color:var(--accent)}
.tpl-n{color:var(--tx3);font-size:11px;flex-shrink:0}
.progbar{width:44px;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.progbar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ms-diamond{color:var(--danger);font-size:14px}
.dl-warn{color:var(--danger);margin-left:4px;cursor:help;font-weight:700}
.ow-warn{margin-left:2px;cursor:help}
.manual-badge{font-size:11px;margin-left:4px;cursor:help}
.c-float.crit{color:var(--danger);font-weight:700}
.nm-edit{width:100%;min-width:60px;font:inherit;padding:2px 4px;border:1px solid #2563eb;border-radius:4px;outline:none;background:#fff}
.g-tog{cursor:pointer;display:inline-block;width:14px}
.pane-split{width:6px;flex-shrink:0;cursor:col-resize;background:transparent;margin-left:-3px;margin-right:-3px;position:relative;z-index:6}
.pane-split:hover,.pane-split.drag{background:rgba(37,99,235,.35)}
.gantt-pane{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.gantt-head{height:44px;background:var(--card);border-bottom:1px solid var(--line);position:relative;overflow:hidden;flex-shrink:0}
.gantt-body{flex:1;overflow:auto;position:relative}
.gantt-inner{position:relative;min-height:100%}
.g-row{position:relative;border-bottom:1px solid var(--line2)}
.g-row.group{background:#e8eef555}
.g-bar{position:absolute;height:20px;top:7px;border-radius:4px;cursor:grab;display:flex;align-items:center;overflow:hidden;font-size:11px;color:#fff;white-space:nowrap}
.g-bar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.35);border-radius:4px 0 0 4px}
.g-bar .lbl{position:relative;padding:0 8px;z-index:1}
.g-bar.crit{border:2px solid #7f1d1d}
.g-bar.crit .lbl{font-weight:700}
.g-side{position:absolute;height:34px;line-height:34px;font-size:11px;color:#374151;white-space:nowrap;pointer-events:none;z-index:2}
.g-ms{position:absolute;top:9px;width:16px;height:16px;transform:rotate(45deg);cursor:grab;border-radius:2px}
.g-ms.crit{box-shadow:0 0 0 2px #7f1d1d}
.g-base{position:absolute;height:5px;border-radius:2px;background:#9ca3af;opacity:.85;z-index:2;pointer-events:none}
.g-base-ms{position:absolute;width:8px;height:8px;transform:rotate(45deg);background:#9ca3af;opacity:.85;z-index:2;pointer-events:none}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;z-index:5}
.g-weekend{position:absolute;top:0;bottom:0;background:#f3f4f6;z-index:0}
.g-holiday{position:absolute;top:0;bottom:0;background:#fef2f2;z-index:0}
.g-dep{position:absolute;z-index:4;pointer-events:none}
.gh-y{position:absolute;top:0;height:22px;line-height:22px;background:#7BA7BC;color:#fff;font-weight:700;font-size:12px;text-align:center;border-right:1.5px solid #fff;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.gh-m{position:absolute;top:22px;height:22px;line-height:22px;background:#BDD5E5;color:#1f2937;font-size:11px;text-align:center;border-right:1px solid #fff;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.gh-m.off{background:#d6e3ec;color:#6b7280}
.day-cell{position:absolute;top:0;bottom:0;border-right:1px dashed #e5e7eb}
.gh-day{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
.gh-date{font-size:9px;font-weight:600;color:var(--tx2);white-space:nowrap;line-height:1.25}
.gh-wd{font-size:8px;color:var(--tx3);white-space:nowrap;line-height:1.25}
.gh-wk{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--tx2);white-space:nowrap;overflow:hidden}
.g-bandrow{position:absolute;left:0;top:0;border-bottom:1px solid var(--line);background:var(--card)}
.g-band{position:absolute;top:0;height:100%;display:flex;align-items:center;overflow:hidden;font-size:10px;color:#1e3a52;border-right:1px solid rgba(255,255,255,.8);white-space:nowrap}
.g-band span{padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-band.vda{font-size:11px;color:#1f2937}
.g-band.vda span{padding:0 6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:10px;width:520px;max-width:94vw;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{background:var(--steel);color:#fff;padding:12px 16px;font-size:14px;font-weight:600;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center}
.modal-h button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
.modal-b{padding:16px}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.frow input,.frow select,.frow textarea{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:8px 10px;font-size:13px}
.frow input:focus,.frow select:focus,.frow textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #93c5fd55}
.frow2{display:flex;gap:12px}
.frow2>div{flex:1}
.modal-f{padding:12px 16px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px}
.modal-f button{padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--line)}
.modal-f .ok{background:var(--accent);border-color:var(--accent);color:#fff}
.cal-panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 16px}
.cal-panel h3{font-size:13px;margin-bottom:8px}
.cal-panel textarea{width:100%;height:64px;border:1px solid #cbd5e1;border-radius:6px;padding:8px;font-size:12px;resize:vertical}
.cal-panel .row{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.cal-panel button{background:var(--steel2);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer}
.cal-panel button.on{background:var(--accent)}
.cal-panel .hint{font-size:11px;color:var(--tx3);margin-top:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;display:none}
#pvModal{position:fixed;inset:0;background:rgba(17,24,39,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#pvModal.open{display:flex}
.pv-box{background:#fff;border-radius:10px;padding:12px 14px;max-width:90vw;max-height:85vh;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:16px;font-weight:600;font-size:14px;color:#1f2937}
.pv-x{background:#e5e7eb;color:#1f2937;border:none;border-radius:6px;width:28px;height:28px;font-size:16px;line-height:1;cursor:pointer;padding:0;flex-shrink:0}
.pv-x:hover{background:#d1d5db}
#pvImg{display:block;max-width:calc(90vw - 32px);max-height:calc(85vh - 62px);border:1px solid #e5e7eb;border-radius:6px}
.dep-line{stroke:#94a3b8;stroke-width:1.5;fill:none}
@media(max-width:768px){.table-pane{width:300px;min-width:260px}}
/* ===== 手机端补充适配（仅小屏生效，不改桌面端布局与配色；不动 viewport，不拦截浏览器原生缩放） ===== */
@media (max-width:768px){
  /* 顶栏标题缩小 */
  header{height:auto;min-height:48px;flex-wrap:wrap;padding:6px 10px;row-gap:6px}
  header h1{font-size:13px}
  header .sub{display:none}
  /* 工具条按钮允许换行不溢出，触摸目标不小于 40px */
  .toolbar{padding:6px 10px;gap:6px}
  header button,.toolbar button,.viewbtns button,.modal-f button,.cal-panel button{min-height:40px;min-width:40px}
  .frow input,.frow select,.frow textarea{min-height:40px}
  /* 左侧任务表允许横向滚动（列宽不压缩，表头表体同宽同滚），甘特区横向滚动 */
  .table-pane{width:42%;min-width:0;max-width:none;overflow-x:auto}
  .table-inner{min-width:520px}
  .toolbar .ck,.toolbar select{min-height:40px}
  .gantt-pane{min-width:0}
  /* 表格字号适当缩小 */
  .table-head{font-size:10px}
  .trow>div{font-size:11px;padding:6px 4px}
  .gh-date{font-size:8px}
  .gh-wd{font-size:7px}
  .toast{max-width:90vw}
}
</style>
<style id="embedCss">
html.embed header, html.embed #btnFromPlan, html.embed #btnSyncBack, html.embed #oemSelect,
html.embed #btnExport, html.embed #btnImport, html.embed #btnCSV + .x{display:none!important}
</style>
<script>if(window.self !== window.top) document.documentElement.className += " embed";</script>
</head>
<body>
<header>
  <h1 data-i18n="appTitle">执行层计划</h1><span class="sub">Execution Plan</span>
  <span class="sp"></span>
  <div class="langbtns">
    <button data-lang="zh">中文</button><button data-lang="en">EN</button><button data-lang="de">DE</button>
  </div>
  <button id="btnBack" data-i18n="backToPlan">← 里程碑计划</button>
</header>
<div class="toolbar">
  <button id="btnAdd" class="primary" data-i18n="addTask">+ 新增任务</button>
  <button id="btnAddGroup" data-i18n="addGroup">+ 新增分组</button>
  <button id="btnAddMs" data-i18n="addMs">+ 里程碑</button>
  <span class="sep"></span>
  <button id="btnFromPlan" data-i18n="fromPlan">从计划导入</button>
  <button id="btnSyncBack" data-i18n="syncBack">回写里程碑计划</button>
  <button id="btnImportSub" data-i18n="importSub">导入细项</button>
  <button id="btnTPL" data-i18n="tplBtn" style="display:none">模板</button>
  <span class="sep"></span>
  <div class="viewbtns">
    <button data-view="day" class="on" data-i18n="vDay">日</button><button data-view="week" data-i18n="vWeek">周</button><button data-view="month" data-i18n="vMonth">月</button>
  </div>
  <span class="sep"></span>
  <button id="btnCols" data-i18n="colSettings">显示列 ▾</button>
  <select id="oemSelect" title="OEM"></select>
  <label class="ck"><span data-i18n="barLbl">条形标注</span> <select id="selBarLbl" style="height:28px"><option value="name" data-i18n="blName">名称</option><option value="start" data-i18n="blStart">开始日期</option><option value="end" data-i18n="blEnd">完成日期</option><option value="none" data-i18n="blNone">不显示</option></select></label>
  <label class="ck"><input type="checkbox" id="ckPhase" checked><span data-i18n="showPhase">阶段</span></label>
  <label class="ck"><input type="checkbox" id="ckCrit"><span data-i18n="criticalPath">关键路径</span></label>
  <button id="btnBaseline" data-i18n="saveBaseline">保存基线</button>
  <label class="ck"><input type="checkbox" id="ckBaseline"><span data-i18n="showBaseline">基线对比</span></label>
  <label class="ck"><input type="checkbox" id="ckResWarn" checked><span data-i18n="resWarn">资源预警</span></label>
  <span class="sep"></span>
  <button id="btnCal" data-i18n="workCal">工作日历</button>
  <span class="sep"></span>
  <button id="btnPDF" data-i18n="exportPDF">导出 PDF</button>
  <button id="btnJPG" data-i18n="exportJPG">导出 JPG</button>
  <button id="btnXls" data-i18n="expXls">导出 Excel</button>
  <button id="btnPreview" data-i18n="preview">预览</button>
  <span class="sep"></span>
  <button id="btnExport" data-i18n="exportJSON">导出JSON</button>
  <button id="btnImport" data-i18n="importJSON">导入JSON</button>
  <input type="file" id="fileJSON" accept=".json" style="display:none">
  <button id="btnCSV" data-i18n="exportCSV">导出CSV</button>
  <span class="sep"></span>
  <button id="btnExpXML" data-i18n="expXml">导出 XML</button>
  <button id="btnImpXML" data-i18n="impXml">导入 XML</button>
  <input type="file" id="fileXML" accept=".xml" style="display:none">
</div>
<div class="cal-panel" id="calPanel" style="display:none">
  <h3 data-i18n="calTitle">工作日历 · 自然语言导入</h3>
  <div class="row" style="margin-bottom:6px">
    <select id="calModeSel" title="Calendar"></select>
    <button id="calModeNL" data-i18n="calModeNL">自然语言</button>
    <button id="calModeText" data-i18n="calModeText">文本格式</button>
  </div>
  <textarea id="calInput" data-i18n-ph="calPh" placeholder="例如：2026年春节2月15日到2月23日放假，2月14日、2月28日调休上班"></textarea>
  <div class="row">
    <button id="btnCalParse" data-i18n="calParse">解析并导入</button>
    <button id="btnCalReset" data-i18n="calReset">恢复默认</button>
    <span class="hint" id="calSummary"></span>
  </div>

/* OEM ↔ URL slug：BMW(宝马) ↔ bmw（照抄计划页实现，归一化匹配以 OEM_PHASE_SYS 的 key 为准） */
function oemSlug(oem){ var m = String(oem || '').match(/^([A-Za-z0-9]+)/); return m ? m[1].toLowerCase() : ''; }
function oemFromSlug(slug){
  slug = String(slug || '').toLowerCase();
  for(var k in OEM_PHASE_SYS){ if(oemSlug(k) === slug) return k; }
  return '';
}

/* 执行页工具条 OEM 下拉：选项与里程碑页一致（OEM_PHASE_SYS 全部 16 个 key） */
function buildOemOptions(){
  var sel = document.getElementById("oemSelect");
  sel.innerHTML = '<option value="">' + esc(tr("oemPlaceholder")) + "</option>" + Object.keys(OEM_PHASE_SYS).map(function(o){
    return '<option value="' + esc(o) + '">' + esc(o) + "</option>";
  }).join("");
}
function syncOemSelect(){
  var sel = document.getElementById("oemSelect");
  if(sel) sel.value = state.planOem || "";
}

function taskEnd(t){ // 按工期算结束日（含开始日）

    tok = tok.trim(); if(!tok) return;
    var m = tok.match(/^(\d+|t\d+)\s*(FS|SS|FF|SF)?\s*([+-]?\s*\d+\s*d?)?$/i);

function scheduleAll(){
  var ts = state.tasks.filter(function(t){ return t.type !== "group"; });

  var byId = {}; ts.forEach(function(t){ byId[t.id] = t; });
  r.order.forEach(function(id){
    var t = byId[id]; if(!t) return;
    if(t.manual){ t.end = taskEnd(t); return; } // 手动排程：不重排日期，但其日期仍作为后续任务的前置约束

/* 文本格式解析（hark 兼容）：一行一条
   2026-10-01~2026-10-07,国庆   → 放假区间（名称可选）
   2026-10-08,国庆              → 放假单日
   补班 2026-10-10 / 调休 2026-10-10 → 调休上班 */
function parseCalText(text){
  var holidays = {}, makeup = [];
  text.split("\n").forEach(function(line){
    line = line.trim(); if(!line) return;
    var m = line.match(/^(?:补班|调休|make-up|makeup|ausgleich)\s*[,，]?\s*(\d{4}-\d{2}-\d{2})$/i);
    if(m){ makeup.push(m[1]); return; }
    var p = line.split(/[,，]/), range = (p[0] || "").trim(), name = (p[1] || "节假日").trim() || "节假日";
    var r = range.split("~"), a = r[0].trim(), b = (r[1] || r[0]).trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(a)) return;
    var g = 0;
    while(a <= b && g++ < 400){ holidays[a] = name; a = fmtD(addDays(parseD(a), 1)); }
  });
  return { holidays:holidays, makeup:makeup };
}
function calToText(){ // 当前日历 → 文本格式
  var lines = [], groups = {}, ks = Object.keys(cal.holidays).sort();
  ks.forEach(function(k){
    var n = cal.holidays[k], prev = lines.length ? lines[lines.length-1] : null;
    if(prev && prev.end && fmtD(addDays(parseD(prev.end), 1)) === k && prev.name === n){
      prev.end = k;
    } else lines.push({ start:k, end:k, name:n });

  var out = lines.map(function(l){
    return l.start === l.end ? l.start + "," + l.name : l.start + "~" + l.end + "," + l.name;
  });

/* 自然语言解析：中文日期表达 → 节假日/调休 */
function parseCalNL(text){
  var year = new Date().getFullYear();
  var ym = text.match(/(\d{4})\s*年/); if(ym) year = +ym[1];
  var holidays = {}, makeup = [];
  function dstr(m, d){ return year + "-" + (m<10?"0":"")+m + "-" + (d<10?"0":"")+d; }
  // 区间：X月X日到/至X月X日 / X月X日-X月X日
  var re = /(\d{1,2})月(\d{1,2})[日号]?\s*(?:到|至|-|~)\s*(\d{1,2})月(\d{1,2})[日号]?/g, m;
  var ranges = [];
  while((m = re.exec(text))){
    var a = new Date(year, +m[1]-1, +m[2]), b = new Date(year, +m[3]-1, +m[4]);
    if(b < a) b = new Date(year+1, +m[3]-1, +m[4]);

  }
  // 同月区间：X月X日到X日
  var re2 = /(\d{1,2})月(\d{1,2})[日号]?\s*(?:到|至)\s*(\d{1,2})[日号]/g;
  while((m = re2.exec(text))){
    if(ranges.some(function(r){ return Math.abs(r[2]-m.index) < 4; })) continue;
    ranges.push([new Date(year, +m[1]-1, +m[2]), new Date(year, +m[1]-1, +m[3]), m.index]);
  }

  var re3 = /(\d{1,2})月(\d{1,2})[日号]/g, singles = [];
  while((m = re3.exec(text))){
    var d = new Date(year, +m[1]-1, +m[2]);
    if(ranges.some(function(r){ return d >= r[0] && d <= r[1]; })) continue;
    singles.push([d, m.index]);
  }
  // 判断每个日期片段是放假还是调休：看附近关键词
  function kindAt(idx){
    var ctx = text.slice(Math.max(0, idx-12), idx+16);
    if(/调休|补班|上班/.test(ctx)) return "makeup";
    return "holiday";
  }
  ranges.forEach(function(r){
    var k = kindAt(r[2]);
    var d = new Date(r[0]);
    while(d <= r[1]){ if(k === "makeup") makeup.push(fmtD(d)); else holidays[fmtD(d)] = 1; d = addDays(d, 1); }

    if(kindAt(s[1]) === "makeup") makeup.push(fmtD(s[0])); else holidays[fmtD(s[0])] = 1;
  });
  return { holidays:holidays, makeup:makeup };
}

/* 把 state.colW 应用到表头与全部表体单元格（内联宽 + 冻结列 sticky 偏移） */
function applyColWidths(){

/* 表头右边缘拖拽调列宽（mousedown 起，不触发其他行为）；双击恢复默认宽 */
function bindResize(handle, key){
  handle.addEventListener("mousedown", function(ev){
    ev.preventDefault(); ev.stopPropagation();
    var startX = ev.clientX, startW = handle.parentElement.getBoundingClientRect().width;
    var min = key === "name" ? NAME_MIN_W : COL_MIN_W;
    document.body.classList.add("resizing");
    function mv(e2){
      var w = Math.min(COL_MAX_W, Math.max(min, startW + (e2.clientX - startX)));
      state.colW = state.colW || {};
      state.colW[key] = w;
      applyColWidths(); // 拖拽中只改宽度，不重渲染，避免打断拖拽
    }
    function up(){
      document.removeEventListener("mousemove", mv);
      document.removeEventListener("mouseup", up);
      document.body.classList.remove("resizing");
      save(); render();
    }
    document.addEventListener("mousemove", mv);
    document.addEventListener("mouseup", up);
  });

    ev.preventDefault(); ev.stopPropagation();
    if(!colWOf(key)) return; // 已是默认宽
    setColW(key, null);
    save(); render();

}

  if(!state.planOem) return [];
  var sys = (typeof OEM_PHASE_SYS !== "undefined" && OEM_PHASE_SYS[state.planOem]) || "";
  var names = (typeof PHASE_NAMES !== "undefined" && PHASE_NAMES[sys]) || null;
  if(!names) return [];
  var phases = (typeof OEM_PHASES !== "undefined" && OEM_PHASES[state.planOem]) || {};
  var ms = state.tasks.filter(function(t){ return t.type === "milestone" && String(t.source || "").indexOf("ms:") === 0; });

  vis.forEach(function(t, ri){
    var y = BAND_H + ri * ROW_H;
    html += '<div class="g-row' + (t.type === "group" ? " group" : "") + '" style="height:' + ROW_H + 'px"></div>';

    var late = t.deadline && taskEnd(t) > t.deadline;

      html += '<div class="g-ms' + (crit ? " crit" : "") + '" data-id="' + t.id + '" style="left:' + mx + 'px;top:' + y + 'px;background:' + (t.color || "#dc2626") + '" title="' + tip + '"></div>';
      var mlt = barLblMode() === "name" ? t.name : barDateText(t);
      if(mlt) html += '<div class="g-side" style="left:' + (mx + 22) + 'px;top:' + y + 'px">' + esc(mlt) + "</div>";
    } else {
      var e = parseD(taskEnd(t));
      var bx = X(s, min), bw = Math.max((diffDays(s, e) + 1) * PX_DAY - 4, 8);
      html += '<div class="g-bar' + (crit ? " crit" : "") + '" data-id="' + t.id + '" style="left:' + bx + 'px;top:' + y + 'px;width:' + bw + 'px;background:' + (t.color || "#2563eb") + '" title="' + tip + '">'
        + '<div class="fill" style="width:' + t.progress + '%"></div>'
        + (barLblMode() === "name" ? '<span class="lbl">' + esc(t.name) + " " + t.progress + "%</span>" : "") + "</div>";
      var bdt = barDateText(t);
      if(bdt) html += '<div class="g-side" style="left:' + (bx + bw + 6) + 'px;top:' + y + 'px">' + esc(bdt) + "</div>";
    }
    // 基线灰条（基线对比开启时，画在任务条下方；里程碑画小灰菱形）
    if(state.showBaseline){
      var bb = bmap[t.id];
      if(bb && bb.start){
        var bsd = parseD(bb.start);
        if(bsd){
          if(t.type === "milestone"){
            html += '<div class="g-base-ms" style="left:' + (X(bsd, min) - 4) + 'px;top:' + (y + 25) + 'px"></div>';
          } else {
            var bed = parseD(bb.end) || bsd;
            var bbw = Math.max((diffDays(bsd, bed) + 1) * PX_DAY - 4, 4);
            html += '<div class="g-base" style="left:' + X(bsd, min) + 'px;top:' + (y + 28) + 'px;width:' + bbw + 'px"></div>';
          }
        }
      }
    }
  });
  inner.innerHTML = html;
  inner.style.height = (BAND_H + vis.length * ROW_H) + "px";
  // 拖拽条
  inner.querySelectorAll(".g-bar,.g-ms").forEach(function(b){
    b.addEventListener("mousedown", function(ev){
      ev.preventDefault();
      var t = byId(b.dataset.id); if(!t) return;
      var sx = ev.clientX, orig = t.start, moved = false;
      function mv(e2){
        var dx = Math.round((e2.clientX - sx) / PX_DAY);
        if(dx !== 0) moved = true;
        var ns = addDays(parseD(orig), dx);

        b.style.opacity = "";
        if(moved && t._tmp){ t.start = t._tmp; }
        delete t._tmp; render();
      }
      document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
    });
  });
  // 表格与图表行高同步滚动（双向；表头与表体共用同一滚动容器，竖分割线始终对齐）
  var body = document.getElementById("ganttBody"), ts = document.querySelector(".table-scroll");
  body.onscroll = function(){ ts.scrollTop = body.scrollTop; document.getElementById("ganttHead").scrollLeft = body.scrollLeft; };

}

  var pg = parent.group;
  lines.forEach(function(ln){

/* ============ 导出 Excel（HTML 表格 + mso-number-format，存为 .xls，Excel/WPS 双击打开，含甘特图） ============ */
var XLS_DAY_LIMIT = 180; /* 甘特跨度超过该天数自动切换为按周显示 */
function xlsHeadKey(k){ return k === "id" ? "ID" : ({name:"cName",owner:"cOwner",dur:"cDur",start:"cStart",end:"cEnd",float:"floatCol"})[k]; }
function exportXLS(){
  var vis = visibleTasks();
  /* 甘特日期范围：所有任务起止的最小/最大日期 */
  var min = null, max = null;
  flatTasks().forEach(function(t){
    var s = parseD(t.start), e = parseD(taskEnd(t));
    if(s && (!min || s < min)) min = s;
    if(e && (!max || e > max)) max = e;
  });
  if(!min){ min = new Date(); min.setHours(0,0,0,0); }
  if(!max) max = addDays(min, 30);
  var weekly = diffDays(min, max) + 1 > XLS_DAY_LIMIT;
  /* 任务信息列：ID/任务名称常显，其余仅取 state.colVis 中可见的列 */
  var infoKeys = ["id","name","owner","dur","start","end","float"];
  var keys = infoKeys.filter(function(k){ return colVis(k); });
  /* 甘特列：按天展开；跨度超限则按周（一周一列，任务覆盖该周即着色） */
  var cols = [], c = new Date(min);
  if(weekly) c.setDate(c.getDate() - ((c.getDay() + 6) % 7)); /* 对齐到周一 */
  while(c <= max){ cols.push(new Date(c)); c = addDays(c, weekly ? 7 : 1); }
  function md(d){ return (d.getMonth() + 1) + "/" + d.getDate(); }
  var L = [];
  L.push('<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">');
  L.push('<head><meta charset="UTF-8">');
  L.push('<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>' + esc(planProjectName().slice(0, 31)) + '</x:Name></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->');
  L.push('<style>');
  L.push('table{border-collapse:collapse}');
  L.push('td{border:1px solid #9ca3af;padding:1px 4px;font-size:10pt;white-space:nowrap;mso-number-format:"\\@"}');
  L.push('.ttl{font-size:14pt;font-weight:bold;text-align:center;background:#1e3a52;color:#ffffff}');
  L.push('.hd{font-weight:bold;text-align:center;background:#1e3a52;color:#ffffff}');
  L.push('.hdg{font-weight:bold;text-align:center;background:#e8eef5;color:#1e3a52}');
  L.push('.grp{background:#e8eef5;font-weight:bold}');
  L.push('.bar{background:#2563eb;font-weight:bold}');
  L.push('.ms{background:#dc2626;font-weight:bold}');
  L.push('.c{text-align:center}');
  L.push('</style></head><body><table>');
  /* 第一行：项目标题；第二行：列头（信息列 + 日期 M/D） */
  L.push('<tr><td class="ttl" colspan="' + (keys.length + cols.length) + '">' + esc(planProjectName()) + '</td></tr>');
  var h = keys.map(function(k){
    var center = k !== "name" && k !== "owner";
    return '<td class="hd' + (center ? ' c' : '') + '">' + esc(tr(xlsHeadKey(k))) + '</td>';
  });
  cols.forEach(function(d){ h.push('<td class="hdg c">' + esc(md(d)) + '</td>'); });
  L.push('<tr>' + h.join("") + '</tr>');
  /* 数据行：任务起止区间内的日期单元格填充任务条颜色（里程碑日红色），其余留白 */
  vis.forEach(function(t){
    var isG = t.type === "group", isMs = t.type === "milestone";
    var s = isG ? null : parseD(t.start), e = isG ? null : parseD(taskEnd(t));
    var r = keys.map(function(k){
      var v = "", center = true;
      if(k === "id") v = isG ? "" : rowNo(t.id);
      else if(k === "name"){
        v = isG ? (state.collapsed[t.id] ? "▶ " : "▼ ") + t.name : (isMs ? "◆ " : "") + t.name;
        center = false;
      }
      else if(k === "owner") v = isG ? "" : (t.owner || "");
      else if(k === "dur") v = isG ? "" : (isMs ? "◆" : (t.dur == null ? "" : String(t.dur)));
      else if(k === "start") v = t.start || "";
      else if(k === "end") v = isG ? "" : taskEnd(t);
      else if(k === "float") v = isG ? "" : (floatMap[t.id] === undefined ? "—" : String(floatMap[t.id]));
      return '<td class="' + (center ? 'c ' : '') + (isG ? 'grp' : '') + '">' + esc(v) + '</td>';
    });
    cols.forEach(function(d){
      var hit = false, red = false;
      if(s && e){
        if(weekly){
          var we = addDays(d, 6);
          hit = s <= we && e >= d;          /* 任务覆盖该周即着色 */
          red = isMs && s >= d && s <= we;  /* 里程碑落在该周 */
        } else {
          hit = s <= d && e >= d;
          red = isMs && fmtD(s) === fmtD(d);/* 里程碑日单元格红色 */
        }
      }
      r.push(red ? '<td class="ms">&nbsp;</td>' : (hit ? '<td class="bar">&nbsp;</td>' : '<td>&nbsp;</td>'));
    });
    L.push('<tr>' + r.join("") + '</tr>');
  });
  L.push('</table></body></html>');
  dlURL(URL.createObjectURL(new Blob(["\ufeff" + L.join("\n")], { type:"application/vnd.ms-excel" })), planProjectName() + "_" + fmtD(new Date()).replace(/-/g, "") + ".xls");
}
/* ============ MS Project XML（MSPDI）导入/导出 ============ */
/* 依赖类型 ↔ MSPDI PredecessorLink/Type 映射（约定：0=FF, 1=FS, 2=SF, 3=SS） */
var MSPDI_DEP = { FF:0, FS:1, SF:2, SS:3 };
var MSPDI_DEP_R = { "0":"FF", "1":"FS", "2":"SF", "3":"SS" };
function planProjectName(){

function xmlTag(name, val){ return "<" + name + ">" + esc(val) + "</" + name + ">"; }
function isoDT(d){ return fmtD(d) + "T00:00:00"; }
function exportXML(){
  var ts = flatTasks();
  var uidOf = {};
  ts.forEach(function(t, i){ uidOf[t.id] = i + 1; });
  var L = [];
  L.push('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>');
  L.push('<Project xmlns="http://schemas.microsoft.com/project">');
  L.push(xmlTag("SaveVersion", "14"));
  L.push(xmlTag("Name", planProjectName()));
  L.push(xmlTag("CreationDate", isoDT(new Date())));
  L.push("<Tasks>");
  ts.forEach(function(t){
    var uid = uidOf[t.id];
    var s = parseD(t.start);
    var e = t.type === "milestone" ? s : parseD(taskEnd(t));
    var durH = t.type === "milestone" ? 0 : Math.max(+t.dur || 0, 0) * 8;
    L.push("<Task>");
    L.push(xmlTag("UID", uid));
    L.push(xmlTag("ID", uid));
    L.push(xmlTag("Name", t.name));
    if(t.type === "milestone") L.push(xmlTag("Milestone", "1"));
    if(s) L.push(xmlTag("Start", isoDT(s)));
    if(e) L.push(xmlTag("Finish", isoDT(e)));
    L.push(xmlTag("Duration", "PT" + durH + "H0M0S"));
    normDeps(t.deps).forEach(function(d){
      var pu = uidOf[d.id];
      if(pu == null) return;
      L.push("<PredecessorLink>");
      L.push(xmlTag("PredecessorUID", pu));
      L.push(xmlTag("Type", MSPDI_DEP[d.type] != null ? MSPDI_DEP[d.type] : 1));
      L.push(xmlTag("CrossProject", "0"));
      L.push(xmlTag("LinkLag", (+d.lag || 0) * 480)); /* 滞后工作日 → 分钟 */
      L.push(xmlTag("LagFormat", "7"));
      L.push("</PredecessorLink>");
    });
    L.push("</Task>");
  });
  L.push("</Tasks>");
  L.push("</Project>");
  dlURL(URL.createObjectURL(new Blob([L.join("\n")], { type:"application/xml" })), planProjectName() + "_" + fmtD(new Date()).replace(/-/g, "") + ".xml");
}

var EXPORT_DPI = 600;
function exportScale(cssW, cssH){

  ctx.arcTo(x + w, y + h, x, y + h, r);

        default: x1 = hx + X(pe ? addDays(pe, 1) : ps); x2 = hx + X(s);
      }
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.bezierCurveTo(x1 + 20, y1, x2 - 20, y2, x2, y2);
      ctx.stroke();
    });
  });

  /* ---- 今天线 ---- */
  if(today >= min && today <= max){
    var tx = hx + X(today);
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
    ctx.setLineDash([5, 3]);
    ctx.beginPath(); ctx.moveTo(tx, bodyY + HEAD_H); ctx.lineTo(tx, bodyBot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = expFont(10, true);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(tr('today'), Math.min(Math.max(tx, hx + 24), cssW - 24), bodyY + 11);
    ctx.textBaseline = 'alphabetic';
  }

  /* ---- 图例（按实际内容动态生成） ---- */
  var items = [], hasMs = false, hasRec = false, hasSup = false, hasCustom = false, hasOther = false, otherColor = '#2563eb';
  vis.forEach(function(t){
    if(t.type === 'group') return;
    var src = String(t.source || '');
    if(t.type === 'milestone'){
      if(src.indexOf('sup:') === 0) hasSup = true; else hasMs = true;
    } else if(src.indexOf('rec:') === 0) hasRec = true;
    else if(src === 'custom') hasCustom = true;
    else { hasOther = true; otherColor = t.color || otherColor; }
  });
  if(hasMs) items.push({ c:'#dc2626', t:tr('planGroupMs'), diamond:true });
  if(bands.length) items.push({ c:'#bfdbfe', t:tr('legendPhase'), border:'#60a5fa' });
  if(state.showBaseline && vis.some(function(t){ return bmap[t.id]; })) items.push({ c:'#9ca3af', t:tr('showBaseline') });
  if(hasRec) items.push({ c:'#2563eb', t:tr('planGroupRec') });
  if(hasSup) items.push({ c:'#9333ea', t:tr('planGroupSup'), diamond:true });
  if(hasCustom) items.push({ c:'#16a34a', t:tr('planGroupCustom') });

  if(state.showCrit && vis.some(function(t){ return floatMap[t.id] !== undefined && floatMap[t.id] <= 0; })) items.push({ c:'#ffffff', t:tr('criticalPath'), border:'#7f1d1d' });

    var lx = Math.max((cssW - total) / 2, 8), ly = legendY;

    items.forEach(function(it, i){
      if(it.diamond){

        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = it.c;
        ctx.fillRect(-6, -6, 12, 12);
        ctx.restore();

        ctx.fillStyle = it.c;
        ctx.fillRect(lx, ly - 6, 14, 12);
        ctx.strokeStyle = it.border; ctx.lineWidth = 1;
        ctx.strokeRect(lx, ly - 6, 14, 12);
      } else {
        ctx.fillStyle = it.c;
        ctx.fillRect(lx, ly - 6, 14, 12);
      }
      ctx.fillStyle = '#374151';
      ctx.fillText(it.t, lx + 22, ly);
      lx += 22 + widths[i] + gap;
    });
    ctx.textBaseline = 'alphabetic';
  }

  /* ---- 页脚：日期 ---- */
  var footY = TITLE_H + bodyH + LEGEND_H + FOOT_H / 2;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#6b7280';
  ctx.font = expFont(11, false);
  ctx.textBaseline = 'middle';
  var dLab = tr('expDate') + ':';
  ctx.fillText(dLab, 20, footY);
  ctx.fillText(fmtD(new Date()), 20 + ctx.measureText(dLab).width + 6, footY);
  ctx.textBaseline = 'alphabetic';

  cb(c, cssW, cssH);
}
/* 极简 PDF：单页 + 单张 JPEG 图；页面按 CSS 尺寸（96dpi），图片按导出 DPI = 高分辨率（与计划页同一实现） */
function buildPdf(jpeg, w, h, dispW, dispH){
  var pw = (dispW * 0.75).toFixed(2), ph = (dispH * 0.75).toFixed(2);
  var out = [];
  function bs(s){ for(var i = 0; i < s.length; i++) out.push(s.charCodeAt(i) & 255); }
  function bb(u8){ for(var j = 0; j < u8.length; j++) out.push(u8[j]); }
  function strBytes(s){ var a = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255; return a; }
  var offsets = [0];
  function obj(n, dict, streamU8){
    offsets[n] = out.length;
    bs(n + ' 0 obj\n' + dict + '\nstream\n');
    if(streamU8) bb(streamU8);
    bs('\nendstream\nendobj\n');
  }
  bs('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>');
  obj(4, '<< /Type /XObject /Subtype /Image /Width ' + w + ' /Height ' + h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>', jpeg);
  var content = 'q\n' + pw + ' 0 0 ' + ph + ' 0 0 cm\n/Im0 Do\nQ\n';
  obj(5, '<< /Length ' + content.length + ' >>', strBytes(content));
  var xrefAt = out.length, n = 6;
  bs('xref\n0 ' + n + '\n');
  bs('0000000000 65535 f \n');
  for(var k = 1; k < n; k++){
    var o = String(offsets[k]);
    while(o.length < 10) o = '0' + o;
    bs(o + ' 00000 n \n');
  }
  bs('trailer\n<< /Size ' + n + ' /Root 1 0 R >>\nstartxref\n' + xrefAt + '\n%%EOF');
  return new Uint8Array(out);
}
function exportPDF(){
  renderExportCanvas(function(canvas, cssW, cssH){
    canvas.toBlob(function(blob){
      if(!blob) return;
      var fr = new FileReader();
      fr.onload = function(){
        var pdf = buildPdf(new Uint8Array(fr.result), canvas.width, canvas.height, cssW, cssH);
        dlURL(URL.createObjectURL(new Blob([pdf], { type:'application/pdf' })), exportFileBase() + '.pdf');
      };
      fr.readAsArrayBuffer(blob);
    }, 'image/jpeg', 0.95);
  });
}
function exportJPG(){
  renderExportCanvas(function(canvas){
    canvas.toBlob(function(blob){
      if(!blob) return;

}

/* 从里程碑计划导入：客户里程碑 + 推荐任务 + 供应商节点排 + 自定义任务，全量带入 */
function planRecCfg(p, id){
  var d = (typeof REC_DEFAULTS !== "undefined" && REC_DEFAULTS[id]) || {so:0, eo:0};
  var o = (p.recTasks && p.recTasks[id]) || {};
  return {
    on: o.on !== undefined ? !!o.on : true,
    so: (typeof o.so === "number" && !isNaN(o.so)) ? o.so : d.so,
    eo: (typeof o.eo === "number" && !isNaN(o.eo)) ? o.eo : d.eo

}
function planResolveAnchor(name, nodeNames){
  if(!name) return null;
  var i;
  for(i = 0; i < nodeNames.length; i++){ if(nodeNames[i] === name) return nodeNames[i]; }
  var norm = function(x){ return String(x).toLowerCase().replace(/\s+/g, ""); };
  var target = norm(name);
  for(i = 0; i < nodeNames.length; i++){ if(norm(nodeNames[i]) === target) return nodeNames[i]; }
  return null;

function planPickName(o){ return (o && (o[lang] || o.zh)) || ""; }

/* ============ 合并版核心：客户节点 → 执行甘特图 增量同步 ============
   受管任务按 source 识别：ms:<节点> / rec:<rN> / sup:<排名>|<序号> / custom:<序号>；分组 source 为 grp:ms / grp:rec / grp:sup:<排名> / grp:custom。
   规则：节点改了，受管任务跟着改日期；用户手动改过日期/工期的推荐任务和自定义任务（与上次同步值不同）保留用户的值；
   负责人、输出成果、进度、备注、依赖等用户字段永远保留；用户自己加的任务不动。 */
function planWanted(p){
  var out = [], nodeNames = Object.keys(p.dates || {});
  nodeNames.forEach(function(nm){
    if(p.excluded && p.excluded[nm]) return;
    if(!p.dates[nm] || !parseD(p.dates[nm])) return;
    out.push({ key:"ms:" + nm, grp:"grp:ms", gname:tr("planGroupMs"), name:nm, type:"milestone", start:fmtD(parseD(p.dates[nm])), dur:0, color:"#dc2626" });
  });
  var sys = (typeof OEM_PHASE_SYS !== "undefined" && OEM_PHASE_SYS[p.oem]) || "apqp";
  var phases = (typeof OEM_PHASES !== "undefined" && OEM_PHASES[p.oem]) || {};
  (typeof REC_TASKS !== "undefined" ? REC_TASKS : []).forEach(function(rt){
    var cfg = planRecCfg(p, rt.id);
    if(!cfg.on) return;
    var pk = (rt.phase && (rt.phase[sys] || rt.phase.apqp)) || "";
    var anchor = planResolveAnchor(phases[pk], nodeNames);
    if(!anchor || (p.excluded && p.excluded[anchor]) || !p.dates[anchor]) return;
    var ad = parseD(p.dates[anchor]); if(!ad) return;
    var sd = addDays(ad, cfg.so * 7), ed = addDays(ad, cfg.eo * 7);
    if(ed < sd) return;
    var sn = WORKCAL.snapRange(fmtD(sd), fmtD(ed), cal);
    sd = parseD(sn.s); ed = parseD(sn.e);
    out.push({ key:"rec:" + rt.id, grp:"grp:rec", gname:tr("planGroupRec"), name:planPickName(rt.name), type:"task",
      start:fmtD(sd), dur:Math.max(workdaysBetween(sd, ed) + 1, 1), color:"#2563eb" });
  });
  (p.customMs || []).forEach(function(row){
    if(!row || !row.dates || !row.dates.length) return;
    var rn = row.name || tr("planGroupSup");
    row.dates.forEach(function(it, i){
      if(!it || !it.d || !parseD(it.d)) return;
      out.push({ key:"sup:" + rn + "|" + i, grp:"grp:sup:" + rn, gname:rn, name:it.n || rn, type:"milestone", start:fmtD(parseD(it.d)), dur:0, color:"#9333ea" });
    });
  });
  (p.tasks || []).forEach(function(ct, i){
    if(!ct || !ct.name || !ct.start || !ct.end) return;
    var sd = parseD(ct.start), ed = parseD(ct.end);
    if(!sd || !ed || ed < sd) return;
    out.push({ key:"custom:" + i, grp:"grp:custom", gname:tr("planGroupCustom"), name:ct.name, type:"task",
      start:fmtD(sd), dur:workdaysBetween(sd, ed) + 1, color:"#16a34a" });
  });
  return out;
}
function isManaged(src){ src = String(src || ""); return /^(ms:|rec:|sup:|custom)/.test(src); }
function mergeFromPlan(p){
  if(!p || !p.oem) return 0;
  state.planOem = p.oem;
  var want = planWanted(p), used = {}, groups = {};
  /* 现有分组：优先 source；兼容旧数据（无 source 的分组 → 看其下受管任务的类型） */
  state.tasks.forEach(function(t){ if(t.type === "group" && /^grp:/.test(t.source || "")) groups[t.source] = t; });
  state.tasks.forEach(function(t){
    var s = String(t.source || ""); if(!isManaged(s) || !t.group) return;
    var g = byId(t.group); if(!g || g.source) return;
    var gk = s.indexOf("ms:") === 0 ? "grp:ms" : s.indexOf("rec:") === 0 ? "grp:rec" : s.indexOf("custom") === 0 ? "grp:custom" : "grp:sup:" + s.slice(4).split("|")[0];
    if(!groups[gk]){ g.source = gk; groups[gk] = g; }
  });
  function ensureGroup(w){
    var g = groups[w.grp];
    if(!g){
      g = mkTask({ name:w.gname, type:"group", source:w.grp });
      if(w.grp === "grp:ms") state.tasks.unshift(g); /* 客户节点永远在最上面 */
      else {
        /* 放在最后一个受管分组块之后、用户任务之前 */
        var at = -1;
        state.tasks.forEach(function(t, i){ var s = String(t.source || ""); if(/^grp:/.test(s) || isManaged(s)) at = i; });
        state.tasks.splice(at + 1, 0, g);
      }
      groups[w.grp] = g;
    }
    if(w.grp !== "grp:ms" && w.grp !== "grp:rec" && w.grp !== "grp:custom") g.name = w.gname;
    return g;
  }
  var n = 0;
  want.forEach(function(w){
    var g = ensureGroup(w);
    var t = null;
    for(var i = 0; i < state.tasks.length; i++){ if(state.tasks[i].source === w.key && !used[state.tasks[i].id]){ t = state.tasks[i]; break; } }
    if(!t && w.key.indexOf("sup:") === 0){ /* 旧数据 source=sup:<排名>（无序号）→ 按顺序认领 */
      var legacy = w.key.split("|")[0];
      for(var j = 0; j < state.tasks.length; j++){ var x = state.tasks[j]; if(x.source === legacy && !used[x.id]){ t = x; t.source = w.key; break; } }
    }
    if(!t && w.key.indexOf("custom:") === 0){
      for(var k = 0; k < state.tasks.length; k++){ var y = state.tasks[k]; if(y.source === "custom" && !used[y.id] && y.name === w.name){ t = y; t.source = w.key; break; } }
    }
    if(t){
      var userMoved = t.type !== "milestone" && t.syncStart && (t.start !== t.syncStart || t.dur !== t.syncDur);
      if(t.type === "milestone" || !userMoved){ t.start = w.start; t.dur = w.dur; }
      t.name = w.name;
      if(t.group !== g.id) t.group = g.id;
      if(t.type === "milestone") t.manual = true; /* 客户节点是外部约束，不被依赖推移 */
    } else {
      t = mkTask({ name:w.name, type:w.type, group:g.id, start:w.start, dur:w.dur, source:w.key, color:w.color, manual:w.type === "milestone" });
      var last = state.tasks.indexOf(g);
      state.tasks.forEach(function(z, idx){ if(z.group === g.id) last = idx; });
      state.tasks.splice(last + 1, 0, t);
    }
    if(t.type !== "milestone"){ t.syncStart = w.start; t.syncDur = w.dur; }
    used[t.id] = 1; n++;
  });
  /* 删除不再需要的受管任务、空的受管分组 */
  var gone = {};
  state.tasks.forEach(function(t){ if(isManaged(t.source) && !used[t.id]) gone[t.id] = 1; });
  state.tasks.forEach(function(t){
    if(t.type === "group" && /^grp:/.test(t.source || "") && !gone[t.id]){
      var has = state.tasks.some(function(z){ return z.group === t.id && !gone[z.id]; });
      if(!has) gone[t.id] = 1;
    }
  });
  if(Object.keys(gone).length){
    state.tasks = state.tasks.filter(function(t){ return !gone[t.id]; });
    state.tasks.forEach(function(t){ if(t.deps) t.deps = t.deps.filter(function(d){ return !gone[d.id]; }); if(gone[t.group]) t.group = ""; });
  }
  return n;
}
/* 执行页里拖动/编辑了客户节点里程碑 → 自动写回节点日期（只在有变化时写，避免来回触发） */
function autoSyncBack(){
  var plan = null;
  try{ plan = JSON.parse(localStorage.getItem("gantt-tool-v1")); }catch(e){}
  if(!plan || !plan.dates) return;
  var changed = false;
  state.tasks.forEach(function(t){
    if(t.type !== "milestone") return;
    var src = String(t.source || "");
    if(src.indexOf("ms:") === 0){
      var nm = src.slice(3);
      if(plan.dates[nm] !== undefined && t.start && plan.dates[nm] !== t.start){ plan.dates[nm] = t.start; changed = true; }
    } else if(src.indexOf("sup:") === 0){
      var parts = src.slice(4).split("|"), row = (plan.customMs || []).filter(function(r){ return (r.name || tr("planGroupSup")) === parts[0]; })[0];
      var it = row && row.dates && row.dates[+parts[1]];
      if(it && t.start && it.d !== t.start){ it.d = t.start; changed = true; }
    }
  });
  if(!changed) return;
  plan.execSyncAt = Date.now();
  try{ localStorage.setItem("gantt-tool-v1", JSON.stringify(plan)); }catch(e){}
}
/* ============ 回写里程碑计划（手动双向同步：执行页 → 计划页） ============ */
function syncBack(){

  var n = 0;
  state.tasks.forEach(function(t){
    if(t.type !== "milestone") return;

    if(src.indexOf("ms:") !== 0) return;

  toast(tr("syncBackOk"));
}

  render();
  document.querySelectorAll(".langbtns button").forEach(function(b){
    b.addEventListener("click", function(){ lang = b.dataset.lang; applyLang(); buildOemOptions(); syncOemSelect(); closeTplMenu(); render(); });
  });
  document.getElementById("btnBack").addEventListener("click", function(){ location.href = "index.html?lang=" + lang; });
  document.getElementById("btnCols").addEventListener("click", function(e){ e.stopPropagation(); toggleColMenu(); });
  document.addEventListener("click", function(e){ // 列/模板菜单点击外部自动关闭
    var m = document.getElementById("colMenu");
    if(m && m.style.display === "block" && !m.contains(e.target) && !menuBtnOf(e.target, "btnCols")) closeColMenu();
    var tm = document.getElementById("tplMenu");
    if(tm && tm.style.display === "block" && !tm.contains(e.target) && !menuBtnOf(e.target, "btnTPL")) closeTplMenu();
  });
  document.getElementById("btnAdd").addEventListener("click", function(){ selId = null; openModal(null); });
  document.getElementById("btnAddGroup").addEventListener("click", function(){
    var t = mkTask({ name:"新分组", type:"group" }); state.tasks.push(t); render();
  });
  document.getElementById("btnAddMs").addEventListener("click", function(){
    selId = null; editId = null;
    openModal(null);
    setTimeout(function(){ var s = document.getElementById("fType"); if(s) s.value = "milestone"; }, 60);
  });
  document.querySelectorAll(".viewbtns button").forEach(function(b){
    b.addEventListener("click", function(){
      state.view = b.dataset.view;
      document.querySelectorAll(".viewbtns button").forEach(function(x){ x.classList.toggle("on", x === b); });
      render();
    });
  });
  document.getElementById("btnFromPlan").addEventListener("click", fromPlan);
  document.getElementById("oemSelect").addEventListener("change", function(){
    /* 切换 OEM：阶段色带随之切换；若里程碑计划（gantt-tool-v1）的 oem 与所选一致，自动重新导入里程碑 */
    var newOem = this.value;
    state.planOem = newOem;
    save();
    if(!newOem){ render(); return; } // 清空选择 = 仅去掉色带
    var plan = null;
    try{ plan = JSON.parse(localStorage.getItem("gantt-tool-v1")); }catch(e){}
    if(plan && plan.oem && (plan.oem === newOem || oemSlug(plan.oem) === oemSlug(newOem))){
      if(state.tasks.length && !confirm(tr("oemImportConfirm"))){ render(); return; } // 有任务时先确认，避免 fromPlanData 清空当前任务
      fromPlanData(plan, true);
      toast(tr("oemAutoImport").replace("{0}", newOem));
      return;
    }
    toast(tr("oemNoData"));
    render();
  });
  (function(){ var sb = document.getElementById("selBarLbl"); if(!sb) return; sb.value = barLblMode(); sb.addEventListener("change", function(){ state.barLbl = this.value; save(); renderGantt(); }); })();
  document.getElementById("ckPhase").addEventListener("change", function(){
    state.showPhase = this.checked;
    save(); render();
  });
  document.getElementById("ckCrit").addEventListener("change", function(){
    state.showCrit = this.checked;
    save(); render();
  });
  document.getElementById("btnBaseline").addEventListener("click", saveBaseline);
  document.getElementById("ckBaseline").addEventListener("change", function(){
    state.showBaseline = this.checked;
    save(); render();
  });
  document.getElementById("ckResWarn").addEventListener("change", function(){
    state.resWarn = this.checked;
    save(); render();
  });
  document.getElementById("btnSyncBack").addEventListener("click", syncBack);
  document.getElementById("btnImportSub").addEventListener("click", openSubModal);
  document.getElementById("btnExport").addEventListener("click", exportJSON);
  document.getElementById("btnPDF").addEventListener("click", exportPDF);
  document.getElementById("btnJPG").addEventListener("click", exportJPG);
  document.getElementById("btnPreview").addEventListener("click", exportPreview);
  document.getElementById("pvClose").addEventListener("click", closePreview);
  document.getElementById("pvModal").addEventListener("click", function(e){ if(e.target === this) closePreview(); });
  document.getElementById("btnCSV").addEventListener("click", exportCSV);
  document.getElementById("btnXls").addEventListener("click", exportXLS);
  document.getElementById("btnExpXML").addEventListener("click", exportXML);
  document.getElementById("btnImpXML").addEventListener("click", function(){ document.getElementById("fileXML").click(); });
  document.getElementById("fileXML").addEventListener("change", function(){ if(this.files[0]) importXMLFile(this.files[0]); this.value = ""; });
  document.getElementById("btnTPL").addEventListener("click", function(e){ e.stopPropagation(); toggleTplMenu(); });
  document.getElementById("btnImport").addEventListener("click", function(){ document.getElementById("fileJSON").click(); });
  document.getElementById("fileJSON").addEventListener("change", function(){ if(this.files[0]) importJSONFile(this.files[0]); this.value = ""; });
  document.getElementById("btnCal").addEventListener("click", function(){
    var p = document.getElementById("calPanel"); p.style.display = p.style.display === "none" ? "" : "none";
  });
  document.getElementById("btnCalParse").addEventListener("click", doCalParse);
  document.getElementById("btnCalReset").addEventListener("click", function(){
    resetCal(); updateCalSummary(); save(); render(); toast(tr("calApplied"));
    if(calMode === "text") document.getElementById("calInput").value = calToText();
    document.getElementById("calPreview").innerHTML = "";
  });
  document.getElementById("calModeNL").addEventListener("click", function(){ setCalMode("nl"); });
  document.getElementById("calModeText").addEventListener("click", function(){ setCalMode("text"); });
  setCalMode("nl");
  syncCalModeSel();
  document.getElementById("calModeSel").addEventListener("change", function(){
    cal.mode = this.value; resetCal(); updateCalSummary(); save(); render(); toast(tr("calApplied"));
    if(calMode === "text") document.getElementById("calInput").value = calToText();
  });

  /* ===== 合并版：与「客户节点」页实时联动 ===== */
  window.addEventListener("storage", function(e){
    if(e.key === "gantt-tool-v1"){
      var p = null; try{ p = JSON.parse(e.newValue || "null"); }catch(x){}
      if(p && p.oem){ mergeFromPlan(p); syncOemSelect(); render(); }
    } else if(e.key === "gantt-workcal-v1"){
      cal = WORKCAL.load();
      var p2 = null; try{ p2 = JSON.parse(localStorage.getItem("gantt-tool-v1")); }catch(x){}
      if(p2 && p2.oem) mergeFromPlan(p2);
      render();
    }
  });
  window.addEventListener("message", function(e){
    var d = e.data || {};
    if(d.t === "lang"){ var b = document.querySelector('.langbtns button[data-lang="' + d.v + '"]'); if(b) b.click(); }
    else if(d.t === "resize"){ render(); }
  });
  updateCalSummary();
  document.getElementById("modalX").addEventListener("click", closeModal);
  (function(){ /* 左右分隔条：拖动改左侧表格宽度，记在 state.paneW */
    var sp = document.getElementById("paneSplit"), pane = document.querySelector(".table-pane");
    if(!sp || !pane) return;
    function apply(){ if(state.paneW) pane.style.width = state.paneW + "px"; else pane.style.width = ""; }
    apply();
    sp.addEventListener("pointerdown", function(e){
      e.preventDefault(); var x0 = e.clientX, w0 = pane.getBoundingClientRect().width; sp.classList.add("drag");
      function mv(ev){ var mx = Math.max(200, (document.querySelector(".main").clientWidth || window.innerWidth) - 160); state.paneW = Math.round(Math.min(mx, Math.max(200, w0 + ev.clientX - x0))); apply(); }
      function up(){ sp.classList.remove("drag"); document.removeEventListener("pointermove", mv); document.removeEventListener("pointerup", up); save(); }
      document.addEventListener("pointermove", mv); document.addEventListener("pointerup", up);
    });
    sp.addEventListener("dblclick", function(){ state.paneW = 0; apply(); save(); });
  })();
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("modalOk").addEventListener("click", saveModal);
  document.getElementById("modalDel").addEventListener("click", function(){
    var t = editId && byId(editId);
    if(t){
      var src = String(t.source || "");
      /* 客户里程碑/推荐任务/供应商节点由②客户节点同步，在这里删了下次同步会回来 → 引导到节点页 */
      var _hasKids = state.tasks.some(function(x){ return x.group === t.id; });
      if(isManaged(src) || (/^grp:(ms|rec|sup|custom)/.test(src) && _hasKids)){ alert(tr("managedDel")); return; }
      var gone = {}; gone[t.id] = 1;
      if(t.type === "group"){
        var kids = state.tasks.filter(function(x){ return x.group === t.id; });
        if(kids.length && !confirm(tr("grpDelAsk").replace("{0}", kids.length))) return;
        (function mark(gid){ state.tasks.forEach(function(x){ if(x.group === gid && !gone[x.id]){ gone[x.id] = 1; if(x.type === "group") mark(x.id); } }); })(t.id);
      }
      state.tasks = state.tasks.filter(function(x){ return !gone[x.id]; });
      state.tasks.forEach(function(x){ if(x.deps) x.deps = x.deps.filter(function(d){ return !gone[(d && d.id) || d]; }); });
    }
    closeModal(); render();
  });
  document.getElementById("modalBg").addEventListener("click", function(e){ if(e.target === this) closeModal(); });
  document.getElementById("subX").addEventListener("click", closeSub);
  document.getElementById("subCancel").addEventListener("click", closeSub);
  document.getElementById("subOk").addEventListener("click", doSubImport);
  document.getElementById("subModalBg").addEventListener("click", function(e){ if(e.target === this) closeSub(); });
  document.getElementById("subFile").addEventListener("change", function(){
    var f = this.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){ document.getElementById("subText").value = r.result; };
    r.readAsText(f); this.value = "";
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape"){ closeModal(); closeSub(); closePreview(); closeColMenu(); closeTplMenu(); } });
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
})();

</script>
</body>
</html>
