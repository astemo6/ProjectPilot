<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汽车零部件项目甘特图</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef1f5;color:#1f2937}
#top{height:46px;background:#1e3a52;color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto;white-space:nowrap}
#top h1{font-size:15px;font-weight:600;margin-right:6px}
.tabs{display:flex;gap:4px}
.tabs button,.tb{border:1px solid #4b6a85;background:#2b4d6a;color:#fff;border-radius:6px;padding:0 14px;height:32px;min-height:32px;font-size:13px;cursor:pointer}
.tabs button.on{background:#fff;color:#1e3a52;border-color:#fff;font-weight:600}
.tb:hover,.tabs button:hover{background:#3a6283}
.tabs button.on:hover{background:#fff}
.sp{flex:1}
.oemwrap{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.oemwrap select{height:32px;border-radius:6px;border:1px solid #4b6a85;background:#fff;color:#1f2937;font-size:13px;padding:0 8px;max-width:220px}
.oemwrap.need select{outline:3px solid #fbbf24;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{outline-color:rgba(251,191,36,.25)}}
.arrow{opacity:.55;font-size:13px}
.tabs{align-items:center}
.lang button{padding:0 9px}
.lang button.on,.tabs.lang button.on:hover{background:#2563eb;border-color:#2563eb;color:#fff}
#hint{display:none;background:#fff7e6;color:#92400e;font-size:12px;padding:5px 14px;border-bottom:1px solid #fde3b0}
#hint.show{display:block}
#stage{position:relative;height:calc(100% - 46px)}
#hint.show + #stage{height:calc(100% - 46px - 27px)}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#stage iframe.off{left:-20000px;visibility:hidden}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:.92}
@media (max-width:700px){
  #top{height:auto;min-height:52px;flex-wrap:wrap;padding:6px 8px;white-space:normal}
  #top h1{display:none}
  .tabs button,.tb{height:44px;min-height:44px;min-width:44px}
  .oemwrap select{height:44px}
  .arrow{display:none}
  #stage{height:calc(100% - 108px)}
  #hint.show + #stage{height:calc(100% - 135px)}
}
/* 2026-10-11：根目录只保留 OEM 客户节点页，开发任务页移除（开发任务改用 v4） */
#top .arrow,#top .tabs:not(.lang){display:none!important}
#fExec{display:none!important}
</style>
</head>
<body>
<div id="top">
  <h1 data-t="title">汽车零部件项目甘特图</h1>
  <label class="oemwrap" id="oemWrap"><span data-t="stepOem">① 客户</span><select id="oemSel" aria-label="OEM"><option value="">…</option></select></label>
  <span class="arrow">→</span>
  <div class="tabs">
    <button data-view="plan" data-t="tabPlan">② 客户节点</button>
    <span class="arrow">→</span>
    <button data-view="exec" data-t="tabExec">③ 开发任务</button>
  </div>
  <span class="sp"></span>
  <div class="tabs lang"><button class="tb" data-lang="zh">中文</button><button class="tb" data-lang="en">EN</button><button class="tb" data-lang="de">DE</button></div>
  <button class="tb" id="btnExp" data-t="exp">导出项目</button>
  <button class="tb" id="btnImp" data-t="imp">导入项目</button>
  <button class="tb" id="btnClr" data-t="clr">清空</button>
  <input type="file" id="fileImp" accept=".json,application/json" style="display:none">
</div>
<div id="hint"></div>
<div id="stage">
  <iframe id="fExec" title="项目甘特图"></iframe>
  <iframe id="fPlan" title="客户节点"></iframe>
</div>
<div id="toast"></div>
<script>
(function(){
/* 一个项目 = 三份本地数据：客户节点(gantt-tool-v1)、执行任务(gantt-exec-v1)、工作日历(gantt-workcal-v1)。
   两个视图实时联动：改客户节点 → 项目甘特图里的里程碑和推荐任务自动更新；在项目甘特图里拖动客户里程碑 → 节点日期自动回写。 */
var KEYS = ["gantt-tool-v1", "gantt-exec-v1", "gantt-workcal-v1"];
var T = {
  zh:{title:"汽车零部件项目甘特图", stepOem:"① 客户", tabExec:"③ 开发任务", tabPlan:"② 客户节点", hintOem:"第一步：在左上角选择客户（主机厂），再填客户节点日期。", oemAsk:"切换客户会清空已填的客户节点日期（开发任务里你自己加的任务保留），继续？", exp:"导出项目", imp:"导入项目", clr:"清空",
      hintPlan:"在这里选择客户（主机厂）并填写客户节点日期；本页导出即给主机厂的节点报告。",
      hintExec:"还没有客户节点日期：先到「② 客户节点」填日期，或者直接在这里加任务、载入模板。",
      clrAsk:"清空整个项目（客户节点、任务、工作日历）？", impOk:"项目已导入", impBad:"不是有效的项目文件", expOk:"项目已导出"},
  en:{title:"Auto Parts Project Gantt", stepOem:"① Customer", tabExec:"③ Development Tasks", tabPlan:"② Customer Milestones", hintOem:"Step 1: pick the customer (OEM) at top left, then enter customer milestone dates, then plan development tasks.", oemAsk:"Switching customer clears the milestone dates entered (your own tasks are kept). Continue?", exp:"Export project", imp:"Import project", clr:"Clear",
      hintPlan:"Pick the customer (OEM) and enter customer milestone dates; this page exports the milestone report for the OEM.",
      hintExec:"No customer milestone dates yet: fill them in under ② Customer Milestones, or add tasks / load a template here.",
      clrAsk:"Clear the whole project (milestones, tasks, calendar)?", impOk:"Project imported", impBad:"Not a valid project file", expOk:"Project exported"},
  de:{title:"Projekt-Gantt Automobilzulieferer", stepOem:"① Kunde", tabExec:"③ Entwicklungsaufgaben", tabPlan:"② Kundenmeilensteine", hintOem:"Schritt 1: oben links den Kunden (OEM) wählen, dann Kundenmeilensteine eintragen, dann Entwicklungsaufgaben planen.", oemAsk:"Kundenwechsel löscht die eingetragenen Meilensteindaten (eigene Aufgaben bleiben). Fortfahren?", exp:"Projekt exportieren", imp:"Projekt importieren", clr:"Leeren",
      hintPlan:"Kunden (OEM) wählen und Meilensteintermine eintragen; dieser Export ist der Meilensteinbericht für den OEM.",
      hintExec:"Noch keine Meilensteindaten: unter ② Kundenmeilensteine eintragen oder hier Aufgaben anlegen / Vorlage laden.",
      clrAsk:"Gesamtes Projekt leeren (Meilensteine, Aufgaben, Kalender)?", impOk:"Projekt importiert", impBad:"Keine gültige Projektdatei", expOk:"Projekt exportiert"}
};
/* 预览模式（沙箱里无 localStorage）：由构建脚本注入 INLINE 应用和内存存储 */
var INLINE = window.__INLINE_APPS__ || null;
var mem = {};
function lsOk(){ try{ var k = "__t"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }catch(e){ return false; } }
var PREVIEW = !!INLINE || !lsOk();
function getK(k){ if(PREVIEW) return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; try{ return localStorage.getItem(k); }catch(e){ return null; } }
function setK(k, v){ if(PREVIEW){ if(v === null) delete mem[k]; else mem[k] = v; return; } try{ if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }

var lang = getK("gantt-shell-lang") || "zh";
var view = "plan", curOem = "", oemList = null;
function curOemFromStore(){ try{ var p = JSON.parse(getK("gantt-tool-v1") || "null"); return (p && p.oem) || ""; }catch(e){ return ""; } }
curOem = curOemFromStore();
var fExec = document.getElementById("fExec"), fPlan = document.getElementById("fPlan");
function $(id){ return document.getElementById(id); }
function tr(k){ return (T[lang] || T.zh)[k] || T.zh[k] || k; }
function toast(m){ var t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 1800); }
function hasNodes(){ try{ var p = JSON.parse(getK("gantt-tool-v1") || "null"); return !!(p && p.oem && Object.keys(p.dates || {}).some(function(k){ return p.dates[k]; })); }catch(e){ return false; } }

function post(f, msg){ try{ f.contentWindow.postMessage(msg, "*"); }catch(e){} }
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = tr(el.getAttribute("data-t")); });
  document.querySelectorAll(".lang button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lang") === lang); });
  document.title = tr("title");
  updateHint();
}
function updateHint(){
  var h = $("hint"), txt = "";
  if(!curOem) txt = tr("hintOem");
  else if(view === "plan") txt = ""; /* 2026-10-11：用户要求去掉本页提示条 */
  else if(!hasNodes()) txt = tr("hintExec");
  $("oemWrap").classList.toggle("need", !curOem);
  h.textContent = txt; h.classList.toggle("show", !!txt);
}
function show(v){
  v = "plan"; view = v;
  fExec.classList.toggle("off", v !== "exec");
  fPlan.classList.toggle("off", v !== "plan");
  document.querySelectorAll("#top .tabs:not(.lang) button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-view") === v); });
  updateHint();
  post(v === "exec" ? fExec : fPlan, { t:"resize" });
}

/* ---- 加载两个视图 ---- */
var SHIM = window.__INLINE_SHIM__ || "";
function srcdocFor(app){
  var html = INLINE[app];
  var pre = "<script>window.__PREVIEW_STORE=" + JSON.stringify(mem).replace(/</g, "\\u003c") + ";<\/script>" + SHIM;
  var i = html.indexOf("<head>");
  return i >= 0 ? html.slice(0, i + 6) + pre + html.slice(i + 6) : pre + html;
}
function loadFrames(){
  if(INLINE){ fPlan.srcdoc = srcdocFor("plan"); }
  else { var q = "?lang=" + lang + "&v=" + Date.now(); fPlan.src = "plan.html" + q; }
}
[fExec, fPlan].forEach(function(f){ f.addEventListener("load", function(){ post(f, { t:"lang", v:lang }); if(f === fPlan) post(f, { t:"hello" }); updateHint(); }); });

/* 预览模式：一个视图写数据 → 转发给另一个视图（触发它的 storage 事件），保持两边一致 */
function renderOems(){
  var sel = $("oemSel");
  if(oemList) sel.innerHTML = oemList.map(function(o){ return '<option value="' + String(o.v).replace(/"/g, "&quot;") + '">' + String(o.l).replace(/</g, "&lt;") + "</option>"; }).join("");
  sel.value = curOem;
}
window.addEventListener("message", function(e){
  var d = e.data || {};
  if(d.t === "oems"){ oemList = d.list || []; curOem = d.cur || ""; renderOems(); updateHint(); return; }
  if(d.t !== "ls") return;
  if(getK(d.k) === d.v) return;
  setK(d.k, d.v);
  var other = e.source === fExec.contentWindow ? fPlan : fExec;
  post(other, { t:"ls-in", k:d.k, v:d.v });
  updateHint();
});
if(!PREVIEW) window.addEventListener("storage", function(){ curOem = curOemFromStore(); renderOems(); updateHint(); });

/* ---- 顶栏 ---- */
document.querySelectorAll("#top .tabs:not(.lang) button").forEach(function(b){ b.addEventListener("click", function(){ show(b.getAttribute("data-view")); }); });
$("oemSel").addEventListener("change", function(){
  var v = this.value;
  if(curOem && v !== curOem && hasNodes() && !confirm(tr("oemAsk"))){ this.value = curOem; return; }
  curOem = v; updateHint();
  post(fPlan, { t:"oem", v:v });
  show("plan");
});
document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click", function(){
    lang = b.getAttribute("data-lang"); setK("gantt-shell-lang", lang); applyLang();
    post(fExec, { t:"lang", v:lang }); post(fPlan, { t:"lang", v:lang });
  });
});
function projName(){ try{ var p = JSON.parse(getK("gantt-tool-v1") || "null"); return ((p && p.projectName) || "").replace(/[\\/:*?"<>|]/g, "").trim().slice(0, 40); }catch(e){ return ""; } }
$("btnExp").addEventListener("click", function(){
  var data = { app:"gantt-project", version:3, savedAt:new Date().toISOString() };
  KEYS.forEach(function(k){ var v = getK(k); data[k] = v ? JSON.parse(v) : null; });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:"application/json" }));
  a.download = (projName() || "gantt-project") + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  toast(tr("expOk"));
});
$("btnImp").addEventListener("click", function(){ $("fileImp").click(); });
$("fileImp").addEventListener("change", function(){
  var f = this.files && this.files[0]; this.value = "";
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    var d = null; try{ d = JSON.parse(r.result); }catch(e){}
    if(!d){ toast(tr("impBad")); return; }
    if(d.app === "gantt-project"){ KEYS.forEach(function(k){ setK(k, d[k] ? JSON.stringify(d[k]) : null); }); }
    else if(d.app === "gantt-exec" && d.state){ /* 旧执行页 JSON */ setK("gantt-exec-v1", JSON.stringify(d.state)); }
    else if(d.oem !== undefined && d.dates){ /* 旧里程碑计划 JSON */ setK("gantt-tool-v1", JSON.stringify(d)); }
    else { toast(tr("impBad")); return; }
    curOem = curOemFromStore(); renderOems();
    loadFrames(); toast(tr("impOk"));
    setTimeout(function(){ show(hasNodes() ? "exec" : "plan"); }, 300);
  };
  r.readAsText(f);
});
$("btnClr").addEventListener("click", function(){
  if(!confirm(tr("clrAsk"))) return;
  KEYS.forEach(function(k){ setK(k, null); });
  curOem = ""; renderOems();
  loadFrames(); show("plan");
});

window.__shell = { mem:mem, srcdocFor:srcdocFor, show:show }; /* 调试/测试用 */
applyLang();
loadFrames();
show(hasNodes() ? "exec" : "plan");
})();
</script>
</body>
</html>
