<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目开发甘特图 v4</title>
<style>
:root{
  --steel:#1e3a52; --steel2:#2b4d6a; --steel3:#3a6283; --accent:#2563eb;
  --tx1:#1f2937; --tx2:#4b5563; --tx3:#6b7280;
  --bg:#eef1f5; --side:#f8fafc; --card:#fff; --line:#d9dee5; --line2:#e5e7eb;
  --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx1);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--steel);color:#fff;height:48px;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
header h1{font-size:15px;font-weight:600}
header .sub{font-size:11px;opacity:.7}
header .sp{flex:1}
#projName{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:5px 10px;font-size:13px;width:240px;outline:none}
#projName::placeholder{color:rgba(255,255,255,.6)}
#projName:focus{background:rgba(255,255,255,.2);border-color:#fff}
.ei-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:12px;color:#374151}
.ei-row input[type=text]{border:1px solid #cbd5e1;border-radius:6px;padding:6px 8px;font-size:13px}
.ei-logo{display:flex;align-items:center;gap:10px}
.ei-logo img{max-height:40px;max-width:160px;border:1px solid #e5e7eb;border-radius:4px;padding:2px;background:#fff}
header button{background:var(--steel2);border:1px solid #4b6a85;color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
header button:hover{background:var(--steel3)}
.langbtns{display:flex;gap:4px}
.langbtns button{padding:4px 8px;font-size:11px}
.langbtns button.on{background:var(--accent);border-color:var(--accent)}
.toolbar{background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.toolbar button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--tx1)}
.toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.toolbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar button.primary:hover{background:#1d4ed8}
.toolbar .sep{width:1px;height:20px;background:var(--line)}
.toolbar .tb-break{flex-basis:100%;height:0}
.tb-dd{position:relative;display:inline-block}.tb-ddm{display:none;position:absolute;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.14);padding:8px;z-index:60;flex-direction:column;align-items:stretch;gap:6px;min-width:170px;white-space:nowrap}.tb-ddm.r{left:auto;right:0}.tb-dd.open .tb-ddm{display:flex}.tb-dd.open>.tb-ddb{border-color:var(--accent);color:var(--accent)}.tb-ddm button{text-align:left;width:100%}.tb-ddm select{max-width:none}.tb-ddm .ck{padding:2px 0}
.toolbar .dd{position:relative;display:inline-flex}
.toolbar .dd-b::after{content:""}
.toolbar .dd.open>.dd-b{border-color:var(--accent);color:var(--accent);background:#eff6ff}
.toolbar .dd-m{display:none;position:absolute;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.14);padding:6px;z-index:300;min-width:190px;flex-direction:column;gap:4px}
.toolbar .dd.open>.dd-m{display:flex}
.toolbar .dd-m>button{text-align:left;width:100%;border-color:transparent}
.toolbar .dd-m>button:hover{background:#f1f5f9;border-color:transparent}
.toolbar .dd-m .ck{padding:4px 6px}
.toolbar .dd-m>#btnColors{display:flex;align-items:center;gap:4px;padding:4px 6px;height:auto;font-size:12px;background:transparent}
.trow{height:34px;box-sizing:border-box;overflow:hidden}
.trow.band-sp{height:30px;background:#f8fafc;cursor:default;align-items:center;padding-left:8px;font-size:11px;color:var(--tx3)}
.toolbar .dd-m .dd-row{display:flex;gap:4px;align-items:center}
.toolbar .dd-m select{max-width:none}
.toolbar .dd-h{font-size:11px;color:var(--tx3);padding:2px 6px}
.toolbar .tb-lab{font-size:12px;color:var(--tx3);margin-right:2px}
.toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--tx1);background:#fff;cursor:pointer;max-width:220px}
.toolbar select:hover{border-color:var(--accent)}
.toolbar .ck{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--tx1);cursor:pointer;user-select:none;white-space:nowrap}
.toolbar .ck input{margin:0;accent-color:var(--accent);cursor:pointer}
.viewbtns{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.viewbtns button{border:none;border-radius:0;padding:6px 14px}
.viewbtns button.on{background:var(--steel2);color:#fff}
.main{flex:1;display:flex;min-height:0}
.res-sheet{display:none}
.main:not([data-pane=gantt])>*:not(.res-sheet){display:none!important}
.main[data-pane=res]>#resSheet,.main[data-pane=evm]>#evmSheet,.main[data-pane=net]>#netSheet,.main[data-pane=use]>#useSheet{display:block;flex:1;overflow:auto;padding:12px 16px;background:var(--bg,#f5f7fa)}
.rs-tb{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--tx2)}
.rs-tb button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
.rs-tb button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
table.rs{border-collapse:collapse;background:#fff;font-size:12px;min-width:100%}
table.rs th{background:var(--steel,#3d5a73);color:#fff;font-weight:600;padding:6px 8px;text-align:center;white-space:nowrap;position:sticky;top:0}
table.rs td{border:1px solid var(--line2,#eef0f3);padding:2px 4px;white-space:nowrap}
table.rs td.n{text-align:center;color:var(--tx3);width:32px}
table.rs td.ro{text-align:right;padding-right:8px;color:var(--tx2)}
table.rs tr.over td{background:#fef2f2}
table.rs tr.over td.nm input{color:#b91c1c;font-weight:600}
table.rs input,table.rs select{width:100%;border:1px solid transparent;background:transparent;font:inherit;font-size:12px;padding:3px 4px;box-sizing:border-box;border-radius:4px}
table.rs input:hover,table.rs select:hover{border-color:#cbd5e1;background:#fff}
table.rs input:focus,table.rs select:focus{border-color:#2563eb;background:#fff;outline:none}
table.rs input.num{text-align:right}
table.rs tr.grp td{background:#eef2f7}
table.rs tr.tot td{background:#f8fafc;border-top:2px solid #cbd5e1}
table.ev input[type=date]{min-width:118px}
.g-status{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed #2563eb;z-index:5}
.net-wrap{position:relative}
.net-box{position:absolute;width:176px;height:76px;box-sizing:border-box;background:#fff;border:1.5px solid #2563eb;border-radius:4px;font-size:11px;cursor:pointer;overflow:hidden}
.net-box.crit{border:2px solid #dc2626}.net-box.crit .nb-h{background:#fee2e2}
.net-box.ms{border-radius:14px;border-color:#7c3aed}
.net-box.done{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#f1f5f9 6px,#f1f5f9 8px)}
.nb-h{padding:3px 6px;font-weight:600;background:#eff6ff;border-bottom:1px solid #dbeafe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-g{display:grid;grid-template-columns:1fr 1fr;padding:2px 6px;gap:1px 6px;color:#334155}
.nb-g span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.use td.c{text-align:right;min-width:44px;padding:2px 6px;font-variant-numeric:tabular-nums}
table.use tr.ur td{background:#eef2f7;font-weight:600}
table.use td.ov{color:#b91c1c;background:#fee2e2!important;font-weight:700}
table.rs .del{cursor:pointer;color:var(--danger,#dc2626);text-align:center;width:28px}
.table-pane{width:460px;min-width:200px;max-width:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
/* 表头与表体共用同一滚动容器：竖分割线上下始终对齐；scrollbar-gutter 避免滚动条出现/消失时列宽跳动 */
.table-scroll{flex:1;overflow:auto;min-height:0;scrollbar-gutter:stable}
.table-inner{min-width:0}
.table-head{display:flex;background:var(--steel);color:#fff;font-size:11px;font-weight:600;flex-shrink:0;position:sticky;top:0;z-index:2}
.table-head{height:44px;box-sizing:border-box}.table-head>div{display:flex;align-items:center}
.table-head>div{padding:8px 6px;border-right:1px solid #4b6a85;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.trow{display:flex;border-bottom:1px solid var(--line2);cursor:pointer;align-items:stretch}
.trow:hover{background:#eef4ff}
.trow.sel{background:#dbeafe}
.trow>div{padding:7px 6px;border-right:1px solid var(--line2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;display:flex;align-items:center}
.trow.group{background:#e8eef5;font-weight:600}
.trow.group>div{font-size:12px}
.trow .c-id{width:36px;justify-content:center;color:var(--tx3);flex-shrink:0}
.trow .c-name{flex:1;min-width:0}
.row-del{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:none;cursor:pointer;font-size:12px;padding:1px 4px;border-radius:4px;background:#fff;box-shadow:0 0 0 1px #fecaca}
.row-del:hover{background:#fee2e2}
.trow:hover .row-del,.trow.sel .row-del{display:inline-block}
.trow .c-owner{width:110px;flex-shrink:0}
.trow>div.c-owner,.trow>div.c-work{padding-top:3px;padding-bottom:3px}
.trow .c-cost{width:84px;flex-shrink:0;justify-content:flex-end;font-variant-numeric:tabular-nums}
.table-head .c-cost{width:84px;flex-shrink:0;text-align:center}
.trow .c-work{width:60px;flex-shrink:0;justify-content:center}
.trow .c-work .cell-in,.trow .c-dur .cell-in{text-align:center}
.trow>div.c-dur{padding-top:3px;padding-bottom:3px}
.table-head .c-work{width:60px;flex-shrink:0;text-align:center}
.ow-warn{margin-left:2px;font-size:11px}
.trow .c-dur{width:52px;justify-content:center;flex-shrink:0}
.trow .c-prog{width:56px;justify-content:center;flex-shrink:0}
.trow .c-start{width:86px;justify-content:center;flex-shrink:0;color:var(--tx2)}
.trow .c-end{width:86px;justify-content:center;flex-shrink:0;color:var(--tx2)}
.trow .c-float{width:64px;justify-content:center;flex-shrink:0;color:var(--tx2)}
.trow .c-pred{width:84px;flex-shrink:0}
.trow .c-mode{width:84px;flex-shrink:0}
.trow .c-wbs{width:56px;flex-shrink:0;color:var(--tx2);font-variant-numeric:tabular-nums}
.table-head .c-wbs{width:56px;flex-shrink:0;text-align:center}
.toolbar button:disabled{opacity:.4;cursor:default}
.table-head .c-mode{width:84px;text-align:center;flex-shrink:0}
.trow>div.c-mode{padding-top:3px;padding-bottom:3px}
.trow .c-cons{width:220px;flex-shrink:0;gap:2px}
.table-head .c-pred{width:84px;text-align:center;flex-shrink:0}
.table-head .c-cons{width:220px;text-align:center;flex-shrink:0}
.trow>div.c-start,.trow>div.c-end,.trow>div.c-pred,.trow>div.c-cons{padding-top:3px;padding-bottom:3px}
.cell-in{width:100%;min-width:0;font:inherit;font-size:12px;color:var(--tx);padding:2px 3px;border:1px solid transparent;border-radius:4px;background:transparent;outline:none;box-sizing:border-box}
.cell-in:hover{border-color:#cbd5e1;background:#fff}
.cell-in:focus{border-color:#2563eb;background:#fff}
.cell-in::placeholder{color:#b6bcc6}
.date-in{text-align:center;font-variant-numeric:tabular-nums}
.date-in[disabled]{color:var(--tx);-webkit-text-fill-color:var(--tx);opacity:1;cursor:default}
.date-in[disabled]:hover{border-color:transparent;background:transparent}
.c-cons .cons-sel{flex:1}
.c-cons .cons-date{width:104px;flex:none}
.trow .c-var{width:52px;justify-content:center;flex-shrink:0;color:var(--tx2)}
.trow .c-output,.trow .c-remarks{width:120px;flex-shrink:0;color:var(--tx2)}
.table-head .c-output,.table-head .c-remarks{width:120px;flex-shrink:0}
.table-head .c-id{width:36px;text-align:center;flex-shrink:0}
.table-head .c-name{flex:1}
.table-head .c-owner{width:110px;flex-shrink:0}
.table-head .c-dur{width:52px;text-align:center;flex-shrink:0}
.table-head .c-prog{width:56px;text-align:center;flex-shrink:0}
.table-head .c-start{width:86px;text-align:center;flex-shrink:0}
.table-head .c-end{width:86px;text-align:center;flex-shrink:0}
.table-head .c-float{width:64px;text-align:center;flex-shrink:0}
.table-head .c-var{width:52px;text-align:center;flex-shrink:0}
/* ===== 冻结列：ID + 任务名称（横向滚动时固定左侧，表头与表体均冻结） ===== */
.table-head>div{position:relative}
/* v4：除名称列外均不压缩；名称列保底宽度，表头与表体竖线对齐 */
.table-head>div:not(.c-name),.trow>div:not(.c-name){flex-shrink:0}
.table-head .c-name,.trow .c-name{min-width:180px}
.trow .c-name .nm-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.table-head,.trow{min-width:max-content}
.table-head .c-id,.table-head .c-name{position:sticky;background:var(--steel);z-index:4}
.table-head .c-id{left:0}
.table-head .c-name{left:36px}
.trow .c-id,.trow .c-name{position:sticky;z-index:1;background:var(--card)}
.trow .c-id{left:0}
.trow .c-name{left:36px}
.trow:hover .c-id,.trow:hover .c-name{background:#eef4ff}
.trow.sel .c-id,.trow.sel .c-name{background:#dbeafe}
.trow.group .c-id,.trow.group .c-name{background:#e8eef5}
/* 列宽拖拽手柄：表头单元格 hover 时显示竖线，左右箭头光标 */
.col-resize{position:absolute;top:0;bottom:0;right:-3px;width:7px;cursor:col-resize;z-index:5;display:none}
.col-resize::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;border-radius:1px;background:var(--accent)}
.table-head>div:hover .col-resize{display:block}
body.resizing{cursor:col-resize;user-select:none}
body.resizing .col-resize{display:block}
/* 列设置弹出菜单 */
.col-menu{position:fixed;z-index:60;display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:8px 10px;min-width:150px}
.col-menu h4{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.col-menu label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx1);padding:4px 2px;cursor:pointer;user-select:none;white-space:nowrap}
.col-menu label.dis{opacity:.45;cursor:default}
.col-menu input{margin:0;accent-color:var(--accent)}
/* 模板库下拉菜单（复用 col-menu 容器样式；分组标题+条目按钮） */
.tpl-g{font-size:11px;font-weight:600;color:var(--tx3);padding:8px 2px 2px}
.tpl-it{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:none;padding:6px 8px;font-size:12px;cursor:pointer;color:var(--tx1);border-radius:4px;text-align:left}
.tpl-it:hover{background:#eef4ff;color:var(--accent)}
.tpl-n{color:var(--tx3);font-size:11px;flex-shrink:0}
.progbar{width:44px;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.progbar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ms-diamond{color:var(--danger);font-size:14px}
.dl-warn{color:var(--danger);margin-left:4px;cursor:help;font-weight:700}
.ow-warn{margin-left:2px;cursor:help}
.manual-badge{font-size:11px;margin-left:4px;cursor:help}
.c-float.crit{color:var(--danger);font-weight:700}
.nm-edit{width:100%;min-width:60px;font:inherit;padding:2px 4px;border:1px solid #2563eb;border-radius:4px;outline:none;background:#fff}
.g-tog{cursor:pointer;display:inline-block;width:14px}
.pane-split{width:6px;flex-shrink:0;cursor:col-resize;background:transparent;margin-left:-3px;margin-right:-3px;position:relative;z-index:6}
.pane-split:hover,.pane-split.drag{background:rgba(37,99,235,.35)}
.gantt-pane{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.gantt-head{height:44px;background:var(--card);border-bottom:1px solid var(--line);position:relative;overflow:hidden;flex-shrink:0}
.gantt-body{flex:1;overflow:auto;position:relative}
.gantt-inner{position:relative;min-height:100%}
.g-row{position:relative;border-bottom:1px solid var(--line2)}
.g-row.group{background:#e8eef555}
.g-bar{position:absolute;height:20px;top:7px;border-radius:4px;cursor:grab;display:flex;align-items:center;overflow:hidden;font-size:11px;color:#fff;white-space:nowrap}
.g-bar .fill{position:absolute;left:0;top:7px;height:6px;background:#1e3a8a;border-radius:0}
.g-bar .lbl{position:relative;padding:0 8px;z-index:1}
.g-bar.crit{border:2px solid #7f1d1d}
.g-gap{position:absolute;height:24px;background:var(--bg-gantt,#fff);z-index:3;pointer-events:none;background-image:linear-gradient(to right,#64748b 50%,transparent 0);background-size:6px 2px;background-repeat:repeat-x;background-position:0 50%}
.g-lvl{position:absolute;height:0;border-top:2px solid #94a3b8;z-index:2;pointer-events:none}
.g-lvl::after{content:"";position:absolute;right:-1px;top:-5px;height:8px;border-right:2px solid #94a3b8}
.g-bar.crit .lbl{font-weight:700}
.g-side{position:absolute;height:34px;line-height:34px;font-size:11px;color:#374151;white-space:nowrap;pointer-events:none;z-index:2}
.g-sum{position:absolute;height:5px;background:currentColor;pointer-events:none;z-index:1}
.g-sum:before,.g-sum:after{content:"";position:absolute;top:5px;border-bottom:6px solid transparent}
.g-sum:before{left:0;border-left:6px solid currentColor}.g-sum:after{right:0;border-right:6px solid currentColor}
.g-ms{position:absolute;top:9px;width:16px;height:16px;transform:rotate(45deg);cursor:grab;border-radius:2px}
.g-ms.crit{box-shadow:0 0 0 2px #7f1d1d}
.g-base{position:absolute;height:5px;border-radius:2px;background:#9ca3af;opacity:.85;z-index:2;pointer-events:none}
.g-base-ms{position:absolute;width:8px;height:8px;transform:rotate(45deg);background:#9ca3af;opacity:.85;z-index:2;pointer-events:none}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;z-index:5}
.g-weekend{position:absolute;top:0;bottom:0;background:#f3f4f6;z-index:0}
.g-holiday{position:absolute;top:0;bottom:0;background:#fef2f2;z-index:0}
.g-dep{position:absolute;z-index:4;pointer-events:none}
.gh-y{position:absolute;top:0;height:22px;line-height:22px;background:#7BA7BC;color:#fff;font-weight:700;font-size:12px;text-align:center;border-right:1.5px solid #fff;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.gh-m{position:absolute;top:22px;height:22px;line-height:22px;background:#BDD5E5;color:#1f2937;font-size:11px;text-align:center;border-right:1px solid #fff;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.gh-m.off{background:#d6e3ec;color:#6b7280}
.day-cell{position:absolute;top:0;bottom:0;border-right:1px dashed #e5e7eb}
.gh-day{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
.gh-date{font-size:9px;font-weight:600;color:var(--tx2);white-space:nowrap;line-height:1.25}
.gh-wd{font-size:8px;color:var(--tx3);white-space:nowrap;line-height:1.25}
.gh-wk{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--tx2);white-space:nowrap;overflow:hidden}
.g-bandrow{position:absolute;left:0;top:0;border-bottom:1px solid var(--line);background:var(--card)}

    if(/调休|补班|上班/.test(ctx)) return "makeup";
    return "holiday";

function planRecCfg(p, id){

function planResolveAnchor(name, nodeNames){

  for(i = 0; i < nodeNames.length; i++){ if(nodeNames[i] === name) return nodeNames[i]; }
  var norm = function(x){ return String(x).toLowerCase().replace(/\s+/g, ""); };
  var target = norm(name);
  for(i = 0; i < nodeNames.length; i++){ if(norm(nodeNames[i]) === target) return nodeNames[i]; }

/* ============ 合并版核心：客户节点 → 执行甘特图 增量同步 ============

   规则：节点改了，受管任务跟着改日期；用户手动改过日期/工期的推荐任务和自定义任务（与上次同步值不同）保留用户的值；
   负责人、输出成果、进度、备注、依赖等用户字段永远保留；用户自己加的任务不动。 */
function planWanted(p){
  var out = [], nodeNames = Object.keys(p.dates || {});
  nodeNames.forEach(function(nm){
    if(p.excluded && p.excluded[nm]) return;
    if(!p.dates[nm] || !parseD(p.dates[nm])) return;
    out.push({ key:"ms:" + nm, grp:"grp:ms", gname:tr("planGroupMs"), name:nm, type:"milestone", start:fmtD(parseD(p.dates[nm])), dur:0, color:"#dc2626" });
  });
  var sys = (typeof OEM_PHASE_SYS !== "undefined" && OEM_PHASE_SYS[p.oem]) || "apqp";
  var phases = (typeof OEM_PHASES !== "undefined" && OEM_PHASES[p.oem]) || {};
  (typeof REC_TASKS !== "undefined" ? REC_TASKS : []).forEach(function(rt){
    var cfg = planRecCfg(p, rt.id);
    if(!cfg.on) return;
    var pk = (rt.phase && (rt.phase[sys] || rt.phase.apqp)) || "";
    var anchor = planResolveAnchor(phases[pk], nodeNames);
    if(!anchor || (p.excluded && p.excluded[anchor]) || !p.dates[anchor]) return;
    var ad = parseD(p.dates[anchor]); if(!ad) return;
    var sd = addDays(ad, cfg.so * 7), ed = addDays(ad, cfg.eo * 7);
    if(ed < sd) return;
    var sn = WORKCAL.snapRange(fmtD(sd), fmtD(ed), cal);
    sd = parseD(sn.s); ed = parseD(sn.e);
    out.push({ key:"rec:" + rt.id, grp:"grp:rec", gname:tr("planGroupRec"), name:planPickName(rt.name), type:"task",
      start:fmtD(sd), dur:Math.max(workdaysBetween(sd, ed) + 1, 1), color:"#2563eb" });
  });
  (p.customMs || []).forEach(function(row){
    if(!row || !row.dates || !row.dates.length) return;
    var rn = row.name || tr("planGroupSup");
    row.dates.forEach(function(it, i){
      if(!it || !it.d || !parseD(it.d)) return;
      out.push({ key:"sup:" + rn + "|" + i, grp:"grp:sup:" + rn, gname:rn, name:it.n || rn, type:"milestone", start:fmtD(parseD(it.d)), dur:0, color:"#9333ea" });
    });
  });
  (p.tasks || []).forEach(function(ct, i){
    if(!ct || !ct.name || !ct.start || !ct.end) return;
    var sd = parseD(ct.start), ed = parseD(ct.end);
    if(!sd || !ed || ed < sd) return;
    out.push({ key:"custom:" + i, grp:"grp:custom", gname:tr("planGroupCustom"), name:ct.name, type:"task",
      start:fmtD(sd), dur:workdaysBetween(sd, ed) + 1, color:"#16a34a" });
  });

}
function isManaged(src){ src = String(src || ""); return /^(ms:|rec:|sup:|custom)/.test(src); }
function mergeFromPlan(p){
  if(!p || !p.oem) return 0;
  state.planOem = p.oem;
  var want = planWanted(p), used = {}, groups = {};
  /* 现有分组：优先 source；兼容旧数据（无 source 的分组 → 看其下受管任务的类型） */
  state.tasks.forEach(function(t){ if(t.type === "group" && /^grp:/.test(t.source || "")) groups[t.source] = t; });
  state.tasks.forEach(function(t){
    var s = String(t.source || ""); if(!isManaged(s) || !t.group) return;
    var g = byId(t.group); if(!g || g.source) return;
    var gk = s.indexOf("ms:") === 0 ? "grp:ms" : s.indexOf("rec:") === 0 ? "grp:rec" : s.indexOf("custom") === 0 ? "grp:custom" : "grp:sup:" + s.slice(4).split("|")[0];
    if(!groups[gk]){ g.source = gk; groups[gk] = g; }
  });
  function ensureGroup(w){
    var g = groups[w.grp];
    if(!g){
      g = mkTask({ name:w.gname, type:"group", source:w.grp });
      if(w.grp === "grp:ms") state.tasks.unshift(g); /* 客户节点永远在最上面 */
      else {
        /* 放在最后一个受管分组块之后、用户任务之前 */
        var at = -1;
        state.tasks.forEach(function(t, i){ var s = String(t.source || ""); if(/^grp:/.test(s) || isManaged(s)) at = i; });
        state.tasks.splice(at + 1, 0, g);
      }
      groups[w.grp] = g;
    }
    if(w.grp !== "grp:ms" && w.grp !== "grp:rec" && w.grp !== "grp:custom") g.name = w.gname;
    return g;
  }
  var n = 0;
  want.forEach(function(w){
    var g = ensureGroup(w);
    var t = null;
    for(var i = 0; i < state.tasks.length; i++){ if(state.tasks[i].source === w.key && !used[state.tasks[i].id]){ t = state.tasks[i]; break; } }
    if(!t && w.key.indexOf("sup:") === 0){ /* 旧数据 source=sup:<排名>（无序号）→ 按顺序认领 */
      var legacy = w.key.split("|")[0];
      for(var j = 0; j < state.tasks.length; j++){ var x = state.tasks[j]; if(x.source === legacy && !used[x.id]){ t = x; t.source = w.key; break; } }
    }

    }
    if(t){

      if(t.type === "milestone" || !userMoved){ t.start = w.start; t.dur = w.dur; if(consNeedsDate(t.cons)) t.consDate = consOnFinish(t.cons) ? taskEnd(t) : w.start; }
      t.name = w.name;
      if(t.group !== g.id) t.group = g.id;
      if(t.type === "milestone" && String(t.source || "").indexOf("ms:") === 0) t.manual = true; /* 客户里程碑是外部约束，不被依赖推移；供应商节点设了前置后可自动排程 */
    } else {
      t = mkTask({ name:w.name, type:w.type, group:g.id, start:w.start, dur:w.dur, source:w.key, color:w.color, manual:w.type === "milestone" });
      var last = state.tasks.indexOf(g);

  state.tasks.forEach(function(t){
    if(t.type === "group" && /^grp:/.test(t.source || "") && !gone[t.id]){

    }
  });
  if(Object.keys(gone).length){
    state.tasks = state.tasks.filter(function(t){ return !gone[t.id]; });
    state.tasks.forEach(function(t){ if(t.deps) t.deps = t.deps.filter(function(d){ return !gone[d.id]; }); if(gone[t.group]) t.group = ""; });
  }

}

function autoSyncBack(){

  var changed = false;
  state.tasks.forEach(function(t){
    if(t.type !== "milestone") return;

    if(src.indexOf("ms:") === 0){
      var nm = src.slice(3);

    } else if(src.indexOf("sup:") === 0){
      var parts = src.slice(4).split("|"), row = (plan.customMs || []).filter(function(r){ return (r.name || tr("planGroupSup")) === parts[0]; })[0];

}

function oemMsKey(oem, name){ return "oem:" + oem + "|" + name; }
function oemMsTasks(oem){ return state.tasks.filter(function(t){ return t.type === "milestone" && String(t.source || "").indexOf("oem:" + oem + "|") === 0; }); }
function openOemMs(oem){

  var have = {}; if(oem) oemMsTasks(oem).forEach(function(t){ have[t.source] = t; });

    + '<div class="frow"><label>' + esc(tr("oemMsOem")) + '</label><select id="omOem"><option value="">' + esc(tr("oemMsPick")) + "</option>"
    + OEM_ORDER.map(function(o){ return '<option value="' + esc(o) + '"' + (o === oem ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("") + "</select></div>";

      + OEM_NODES[oem].map(function(n, i){ var t = have[oemMsKey(oem, n[0])];
          return '<tr><td style="text-align:center"><input type="checkbox" class="omCk" data-i="' + i + '"' + (t || fresh ? " checked" : "") + ' style="width:auto"></td><td title="' + esc(n[0] + " — " + (n[L] || n[2] || "")) + '">' + esc(oemShort(n[0])) + '</td><td><input type="date" class="omD" data-i="' + i + '" value="' + esc(t ? t.start : "") + '"></td></tr>'; }).join("")
      + "</tbody></table></div>";

  bg.innerHTML = h; document.body.appendChild(bg);

  bg.querySelector("#omX").onclick = close; bg.querySelector("#omCancel").onclick = close;

  bg.querySelector("#omAll").onclick = function(){ bg.querySelectorAll(".omCk").forEach(function(c){ c.checked = true; }); };
  bg.querySelector("#omNone").onclick = function(){ bg.querySelectorAll(".omCk").forEach(function(c){ c.checked = false; }); };
  function fillDates(){
    var ds = bg.querySelectorAll(".omD"), gaps = CASCADE_GAPS[oem] || CASCADE_GAPS.DEFAULT, first = -1, i, cur;
    function g(k){ return typeof gaps[k] === "number" ? gaps[k] : 30; }
    for(i = 0; i < ds.length; i++) if(parseD(ds[i].value)){ first = i; break; }
    if(first < 0) return false;
    cur = parseD(ds[first].value); /* 向前反推 */
    for(i = first - 1; i >= 0; i--){ cur = addDays(cur, -g(i)); while(!isWorkday(cur)) cur = addDays(cur, -1); ds[i].value = fmtD(cur); }
    cur = parseD(ds[first].value); /* 向后顺推（已填的日期保留） */
    for(i = first + 1; i < ds.length; i++){ var v = parseD(ds[i].value); if(v){ cur = v; continue; } cur = snapWorkday(addDays(cur, g(i - 1))); ds[i].value = fmtD(cur); }
    return true;
  }
  bg.querySelector("#omFill").onclick = function(){
    if(!fillDates()){ var ds = bg.querySelectorAll(".omD"); ds[ds.length - 1].focus(); toast(tr("oemMsFirst")); }
  };
  bg.querySelector("#omOk").onclick = function(){
    var pick = [];
    bg.querySelectorAll(".omCk").forEach(function(c){ var i = +c.dataset.i, d = bg.querySelector('.omD[data-i="' + i + '"]').value; if(c.checked && parseD(d)) pick.push({ n:OEM_NODES[oem][i], d:fmtD(snapWorkday(parseD(d))) }); });
    var keep = {}; pick.forEach(function(p){ keep[oemMsKey(oem, p.n[0])] = p; });
    if(!pick.length && !oemMsTasks(oem).length){
      /* 一个日期都没填：以今天为第一个节点自动排出示例日期，让用户确认后再点确定 */
      var d0 = bg.querySelectorAll(".omD")[0]; d0.value = fmtD(snapWorkday(new Date())); fillDates();
      toast(tr("oemMsAuto")); return;
    }
    /* 先删除其他主机厂已插入的客户里程碑及其分组（只保留当前主机厂一套） */
    var dropO = {}, dropG = {};
    state.tasks.forEach(function(t){ var s = String(t.source || "");
      if(s.indexOf("oem:") === 0 && s.indexOf("oem:" + oem + "|") !== 0) dropO[t.id] = 1;
      if(t.type === "group" && s.indexOf("oemgrp:") === 0 && s !== "oemgrp:" + oem) dropG[t.id] = 1; });
    if(Object.keys(dropO).length || Object.keys(dropG).length){
      state.tasks.forEach(function(t){ if(dropG[t.group] && !dropO[t.id]) t.group = ""; }); /* 用户放进旧分组的任务移到顶层 */
      state.tasks = state.tasks.filter(function(t){ return !dropO[t.id] && !dropG[t.id]; });
      state.tasks.forEach(function(t){ t.deps = normDeps(t.deps).filter(function(d){ return !dropO[d.id] && !dropG[d.id]; }); });
    }
    /* 分组 */
    var gsrc = "oemgrp:" + oem, grp = null;
    state.tasks.forEach(function(t){ if(t.type === "group" && t.source === gsrc) grp = t; });
    if(!grp && pick.length){ grp = mkTask({ name:tr("oemMsGrp"), type:"group", group:"" }); grp.source = gsrc; state.tasks.unshift(grp); }
    /* 移除取消勾选的 */
    var drop = {}; oemMsTasks(oem).forEach(function(t){ if(!keep[t.source]) drop[t.id] = 1; });
    state.tasks = state.tasks.filter(function(t){ return !drop[t.id]; });
    state.tasks.forEach(function(t){ t.deps = normDeps(t.deps).filter(function(d){ return !drop[d.id]; }); });
    /* 新增 / 更新（按节点顺序排在分组内） */
    var existing = {}; oemMsTasks(oem).forEach(function(t){ existing[t.source] = t; });
    var insertAt = state.tasks.indexOf(grp) + 1;
    pick.forEach(function(p){
      var key = oemMsKey(oem, p.n[0]), t = existing[key];
      if(t){ if(t.name === p.n[0]) t.name = oemShort(t.name); t.start = p.d; t.cons = "MSO"; t.consDate = p.d; t.group = grp.id; }
      else {
        t = mkTask({ name:oemShort(p.n[0]), type:"milestone", group:grp.id, start:p.d, dur:0 });
        t.source = key; t.cons = "MSO"; t.consDate = p.d; t.remarks = (lang === "zh" ? p.n[2] : p.n[3]) || p.n[2] || "";
        state.tasks.splice(insertAt, 0, t);

      insertAt = state.tasks.indexOf(t) + 1;
    });
    if(grp && !state.tasks.some(function(t){ return t.group === grp.id; })) state.tasks = state.tasks.filter(function(t){ return t !== grp; });
    state.planOem = oem; syncOemSelect();
    close(); save(); render(); toast(tr("oemMsOk").replace("{0}", pick.length));
  };
}
